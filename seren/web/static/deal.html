<meta charset="utf-8">
<title>Seren · The Deal</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=IM+Fell+English:ital@0;1&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: a shelf (campaign list left, the chosen campaign right) that gives way to the Loom's table.
   One committed dark world, the Loom's own: night-blue felt, gilt, bone. */
:root{
  --felt:#0f1728; --felt-hi:#141f38; --card:#1a2540; --card-lo:#111a2e; --edge:#3a4664; --edge-lo:#2a3450;
  --gilt:#c9a44a; --gilt-hi:#e3c06a; --bone:#e9dcb5; --bone-lo:#b8ab8a; --mute:#7d8aa8; --mute-lo:#4a5570;
  --iron:#8a8f99; --shade:rgba(5,8,16,.72);
  --serif:'IM Fell English',Georgia,'Times New Roman',serif; --display:'Cinzel Decorative','Cinzel',Georgia,serif;
  --sans:'Work Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--felt);color:var(--bone)}
body{font:400 17px/1.5 var(--serif);min-height:100vh;
  background:radial-gradient(1200px 700px at 50% -10%,var(--felt-hi),transparent 70%),var(--felt)}
::selection{background:var(--gilt);color:var(--felt)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--gilt-hi);outline-offset:3px}
img{max-width:100%;display:block}
.wrap{max-width:1240px;margin:0 auto;padding-block:26px 60px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.lbl{font:600 10.5px/1.2 var(--sans);letter-spacing:.18em;text-transform:uppercase;color:var(--gilt)}
.lbl.mute{color:var(--mute)}
h1,h2,h3{font-weight:400;margin:0;text-wrap:balance}

/* top bar */
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.brand{font:400 15px/1 var(--display);letter-spacing:.08em;color:var(--gilt)}
.top .ask{font:italic 400 clamp(20px,3.4vw,26px)/1.2 var(--serif);color:var(--bone);margin-top:8px}
.top .note{font:500 11px/1.4 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}

/* ── the shelf ── */
.shelf{display:grid;grid-template-columns:minmax(230px,300px) minmax(0,1fr);gap:26px;align-items:start}
.list{display:flex;flex-direction:column;gap:12px}
.tab{display:grid;grid-template-columns:72px minmax(0,1fr);gap:12px;align-items:center;text-align:left;padding:10px;border-radius:10px;
  border:1px solid var(--edge-lo);background:linear-gradient(160deg,var(--card),var(--card-lo));box-shadow:0 14px 28px rgba(0,0,0,.45);
  transition:border-color .2s,transform .2s}
.tab:hover{border-color:var(--edge);transform:translateX(3px)}
.tab[aria-selected=true]{border-color:var(--gilt);box-shadow:0 14px 28px rgba(0,0,0,.5),0 0 0 1px var(--gilt),0 0 24px rgba(201,164,74,.22)}
.tab .thumb{width:72px;height:96px;border-radius:6px;object-fit:cover;border:1px solid var(--edge-lo)}
.tab .t{font:400 21px/1.1 var(--serif);color:var(--bone)}
.tab .m{font:500 11px/1.4 var(--sans);letter-spacing:.08em;color:var(--mute);margin-top:6px}
.tab .st{display:inline-block;margin-top:8px;font:600 9.5px/1 var(--sans);letter-spacing:.16em;text-transform:uppercase;padding:5px 7px;border-radius:999px;border:1px solid var(--edge)}
.st.ready{color:var(--felt);background:var(--gilt);border-color:var(--gilt)}
.st.soon{color:var(--mute)}

.detail{border:1px solid var(--edge-lo);border-radius:14px;overflow:hidden;background:var(--card-lo);box-shadow:0 30px 70px rgba(0,0,0,.55);min-width:0}
.hero{position:relative;aspect-ratio:16/8;max-width:100%;background:#000}
.hero img{width:100%;height:100%;object-fit:cover}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 35%,rgba(10,14,26,.55) 62%,var(--card-lo) 100%)}
.hero .cap{position:absolute;left:0;right:0;bottom:0;z-index:1;padding:0 clamp(18px,4vw,36px) 18px}
.hero h2{font:400 clamp(30px,5.6vw,56px)/1 var(--display);color:var(--bone);text-shadow:0 6px 24px rgba(0,0,0,.8)}
.hero .tag{font:italic 400 clamp(16px,2.2vw,21px)/1.35 var(--serif);color:var(--gilt-hi);margin-top:10px;max-width:60ch;text-shadow:0 4px 16px rgba(0,0,0,.9)}
.body{padding:18px clamp(18px,4vw,36px) 30px;display:grid;grid-template-columns:minmax(0,1fr) 200px;gap:28px}
.desc{font-size:18px;line-height:1.6;color:var(--bone);max-width:64ch;margin:0 0 20px}
.facts{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr));gap:8px 18px;margin:0 0 22px;padding:0;list-style:none}
.facts li{font:400 14px/1.45 var(--sans);color:var(--bone-lo);padding-left:16px;position:relative}
.facts li::before{content:"✦";position:absolute;left:0;top:0;color:var(--gilt);font-size:10px;line-height:2}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px}
.chip{display:inline-flex;align-items:center;gap:7px;font:500 12px/1 var(--sans);letter-spacing:.04em;color:var(--bone);padding:8px 11px;border-radius:999px;border:1px solid var(--edge);background:rgba(255,255,255,.03)}
.chip svg{width:14px;height:14px;flex:none}
.chip.chaos{border-color:rgba(201,164,74,.5);color:var(--gilt-hi)}
.side{display:flex;flex-direction:column;gap:14px;align-items:center}
.backs{position:relative;width:170px;height:200px}
.backs img{position:absolute;bottom:0;left:50%;width:112px;aspect-ratio:2/3;max-width:none;object-fit:cover;border-radius:9px;
  box-shadow:0 18px 34px rgba(0,0,0,.6);border:1px solid rgba(0,0,0,.5);transform-origin:bottom center}
.backs img:nth-child(1){transform:translateX(-50%) rotate(-12deg) translateX(-26px)}
.backs img:nth-child(2){transform:translateX(-50%) rotate(0deg) translateY(-6px)}
.backs img:nth-child(3){transform:translateX(-50%) rotate(12deg) translateX(26px)}
.side .lbl{text-align:center}
.go{font:600 12px/1 var(--sans);letter-spacing:.16em;text-transform:uppercase;padding:16px 22px;border-radius:999px;
  background:var(--gilt);color:var(--felt);box-shadow:0 12px 30px rgba(201,164,74,.25);transition:background .2s,transform .2s}
.go:hover{background:var(--gilt-hi);transform:translateY(-2px)}
.go[disabled]{background:transparent;color:var(--mute);border:1px solid var(--edge);box-shadow:none;cursor:default;transform:none}
.ghost{font:600 11px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;padding:12px 16px;border-radius:999px;border:1px solid var(--edge);color:var(--bone-lo)}
.ghost:hover{border-color:var(--gilt);color:var(--bone)}

/* ── the table ── */
.table[hidden],.shelf[hidden]{display:none}
.table{display:flex;flex-direction:column;gap:22px}
.tbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.tbar h2{font:400 clamp(24px,4vw,34px)/1.1 var(--display);color:var(--bone)}
.tbar .sub{font:italic 400 18px/1.3 var(--serif);color:var(--bone-lo);margin-top:4px}
.tbar .acts{display:flex;gap:8px;flex-wrap:wrap}
.felt{border-radius:18px;padding:clamp(16px,3vw,30px);border:1px solid var(--edge-lo);
  background:radial-gradient(900px 500px at 50% 0%,rgba(201,164,74,.07),transparent 70%),linear-gradient(180deg,var(--felt-hi),var(--felt));
  box-shadow:inset 0 0 80px rgba(0,0,0,.5)}
.howto{text-align:center;font:italic 400 19px/1.3 var(--serif);color:var(--gilt-hi);margin:0 0 18px;min-height:1.3em}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,150px));justify-content:center;gap:clamp(10px,1.6vw,18px)}
.slot{display:flex;flex-direction:column;gap:8px;align-items:stretch}
.slot .lbl{text-align:center}
.slot.hers .lbl{color:var(--bone-lo)}
.c3{position:relative;aspect-ratio:2/3;max-width:100%;perspective:900px;border-radius:10px}
.c3 .in{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.3,.7,.2,1)}
.c3.up .in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:10px;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;
  box-shadow:0 18px 34px rgba(0,0,0,.6)}
.face.back{background:#000}
.face.back img{width:100%;height:100%;object-fit:cover}
.face.front{transform:rotateY(180deg);background:linear-gradient(160deg,var(--card),var(--card-lo));border:1px solid var(--gilt);
  padding:12px 11px 11px;display:flex;flex-direction:column;gap:6px;text-align:left}
.face.front .k{font:600 9px/1.2 var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--gilt)}
.face.front .n{font:400 clamp(17px,1.9vw,20px)/1.08 var(--serif);color:var(--bone)}
.face.front .l{font:italic 400 13px/1.3 var(--serif);color:var(--bone-lo)}
.face.front .as{margin-top:auto;font:400 11.5px/1.4 var(--sans);color:var(--bone);border-top:1px solid var(--edge);padding-top:7px}
.c3.down{cursor:pointer}
.c3.down:hover .in{transform:translateY(-6px) rotateZ(-1deg)}
.c3.down::after{content:"";position:absolute;inset:-3px;border-radius:12px;border:1px solid transparent;transition:border-color .2s;pointer-events:none}
.c3.down:hover::after{border-color:var(--gilt)}
.c3.deal{animation:deal .55s cubic-bezier(.2,.8,.2,1) both}
@keyframes deal{from{opacity:0;transform:translateY(60px) rotate(-9deg)}to{opacity:1;transform:none}}
/* locked: dealt face up, in chains */
.chains{position:absolute;inset:0;pointer-events:none;z-index:2}
.chains>svg:not(.lock){position:absolute;inset:0;width:100%;height:100%}
.chains>svg.lock{position:absolute;left:50%;top:59%;transform:translate(-50%,-50%);width:30px;height:36px;z-index:3;filter:drop-shadow(0 4px 8px rgba(0,0,0,.7))}
.c3.locked .face.front{border-color:var(--iron)}
.c3.locked .face.front::after{content:"";position:absolute;inset:0;background:rgba(10,14,26,.25)}

.sentence{text-align:center;font:400 clamp(18px,2.6vw,24px)/1.4 var(--serif);color:var(--bone);max-width:880px;margin:22px auto 0;text-wrap:balance}
.sentence i{color:var(--gilt-hi)}
.sentence .blank{color:var(--mute-lo)}
.laid{display:flex;justify-content:center;gap:10px;margin-top:18px;flex-wrap:wrap}
.count{font:600 12px/1 var(--sans);letter-spacing:.16em;text-transform:uppercase;padding:15px 22px;border-radius:999px;background:rgba(201,164,74,.18);color:var(--gilt-hi);border:1px solid rgba(201,164,74,.35)}

/* dials */
.dials{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:16px 22px}
.dial{display:flex;flex-direction:column;gap:8px}
.dial .h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.dial .h b{font:400 19px/1.1 var(--serif);color:var(--bone);font-weight:400}
.dial .h span{font:500 11px/1 var(--sans);color:var(--gilt-hi);font-variant-numeric:tabular-nums}
.dial .ends{display:flex;justify-content:space-between;font:italic 400 13px/1.2 var(--serif);color:var(--bone-lo)}
.track{position:relative;height:28px}
.track .rail{position:absolute;left:0;right:0;top:12px;height:4px;border-radius:4px;background:var(--edge-lo)}
.track .allowed{position:absolute;top:11px;height:6px;border-radius:6px;background:rgba(201,164,74,.35)}
.track input{position:absolute;inset:0;width:100%;margin:0;background:transparent;-webkit-appearance:none;appearance:none}
.track input::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--gilt);border:2px solid var(--felt);box-shadow:0 0 0 1px var(--gilt)}
.track input::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--gilt);border:2px solid var(--felt)}
.track input::-webkit-slider-runnable-track{background:transparent}
.dial .why{font:400 12.5px/1.45 var(--sans);color:var(--mute)}
.weave{display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:22px;text-align:center}
.weave p{margin:0;font:italic 400 16px/1.4 var(--serif);color:var(--bone-lo);max-width:52ch}
h3.sec{font:400 22px/1.2 var(--display);color:var(--gilt);text-align:center;margin:0 0 16px}

/* make-your-own and the book */
.thumb.own{display:grid;place-items:center;font-size:30px;color:var(--gilt);background:radial-gradient(circle at 50% 40%,rgba(201,164,74,.25),var(--card-lo) 70%)}
.ownhero{background:radial-gradient(700px 300px at 30% 30%,rgba(201,164,74,.22),transparent 70%),linear-gradient(160deg,var(--felt-hi),var(--card-lo))}
.ownhero::after{display:none}
.book{max-width:820px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:14px}
.btitle{font:400 clamp(28px,5vw,46px)/1.05 var(--display);color:var(--bone);text-align:center;margin:4px 0 0}
.bwhere{text-align:center;font:500 11px/1.4 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin:0}
.bprem{font:400 20px/1.55 var(--serif);color:var(--bone);margin:6px 0 0;text-wrap:pretty}
.bopen{border-left:2px solid var(--gilt);padding:4px 0 4px 16px}
.bopen p{font:italic 400 19px/1.5 var(--serif);color:var(--gilt-hi);margin:6px 0 0}
.bacts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:8px}
.bacts a{text-decoration:none}
/* the table: a deck, a row, a hand */
.tabletop{display:grid;grid-template-columns:auto minmax(0,1fr);gap:clamp(12px,2vw,24px);align-items:start}
.pile{display:flex;flex-direction:column;align-items:center;gap:10px;padding-top:22px}
.stack{position:relative;width:96px;aspect-ratio:2/3}
.stack img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:8px;border:1px solid rgba(0,0,0,.6);
  transform:translate(calc(var(--i) * -2px),calc(var(--i) * -2px));box-shadow:0 10px 22px rgba(0,0,0,.55)}
.row{grid-template-columns:repeat(var(--n,9),minmax(0,1fr))!important;justify-content:stretch!important;gap:clamp(8px,1vw,14px)!important}
@media (max-width:900px){.row{grid-template-columns:repeat(auto-fill,minmax(96px,1fr))!important}}
/* her card asks to be turned */
.c3.hersdown{box-shadow:0 0 0 2px var(--gilt),0 0 26px rgba(201,164,74,.45);animation:herglow 2.2s ease-in-out infinite}
@keyframes herglow{50%{box-shadow:0 0 0 2px var(--gilt-hi),0 0 40px rgba(227,192,106,.7)}}
.ribbon{position:absolute;left:50%;bottom:14%;transform:translateX(-50%);z-index:3;pointer-events:none;white-space:nowrap;
  font:600 9.5px/1 var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--felt);background:var(--gilt);padding:7px 10px;border-radius:999px;box-shadow:0 6px 14px rgba(0,0,0,.6)}
.turnher{display:flex;flex-direction:column;align-items:center;gap:10px;margin:6px 0}
.empty{aspect-ratio:2/3;border-radius:10px;border:1px dashed var(--mute-lo);color:var(--mute);font:italic 400 15px/1.2 var(--serif);transition:border-color .2s,color .2s}
.empty:hover{border-color:var(--gilt);color:var(--bone)}
.empty.on{border:1px solid var(--gilt);color:var(--gilt-hi);box-shadow:0 0 0 1px var(--gilt),0 0 22px rgba(201,164,74,.25)}
.c3.mine{cursor:pointer}
.c3.mine.on{box-shadow:0 0 0 2px var(--gilt),0 0 22px rgba(201,164,74,.3)}
.face.front.gilt{border-color:var(--gilt-hi)}
.c3.sealed .waxbox{position:absolute;inset:0;display:grid;place-items:center;z-index:2;pointer-events:none}
.seal{width:52%;filter:drop-shadow(0 6px 10px rgba(0,0,0,.7))}
.mini{font:600 10px/1.2 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--bone-lo);border:1px solid var(--edge);border-radius:999px;padding:7px 9px;margin-top:2px}
.mini:hover{border-color:var(--gilt);color:var(--bone)}
.hand{margin-top:22px;border-top:1px solid var(--edge-lo);padding-top:18px}
.handhead{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.handnote{text-align:center;font:italic 400 18px/1.3 var(--serif);color:var(--gilt-hi);margin:6px 0}
.fan{display:flex;justify-content:center;gap:clamp(8px,1.6vw,18px);flex-wrap:wrap;padding:8px 0 14px}
.hc{width:clamp(140px,17vw,176px);aspect-ratio:2/3;border-radius:11px;padding:13px 12px;text-align:left;display:flex;flex-direction:column;gap:6px;
  background:linear-gradient(160deg,var(--card),var(--card-lo));border:1px solid var(--edge);box-shadow:0 18px 34px rgba(0,0,0,.6);
  transform:rotate(var(--r)) translateY(var(--y));transition:transform .2s,border-color .2s,box-shadow .2s}
.hand.fresh .hc{animation:fromdeck .6s cubic-bezier(.2,.8,.2,1) both}
.hc:hover{transform:rotate(0deg) translateY(-10px);border-color:var(--gilt)}
.hc.taken{border-color:var(--gilt-hi);box-shadow:0 0 0 1px var(--gilt),0 18px 34px rgba(0,0,0,.6),0 0 24px rgba(201,164,74,.28)}
.hc .k{font:600 9px/1.2 var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--gilt)}
.hc .n{font:400 21px/1.08 var(--serif);color:var(--bone)}
.hc .l{font:italic 400 14px/1.3 var(--serif);color:var(--bone-lo)}
.hc .ch{font:400 12px/1.4 var(--sans);color:var(--gilt-hi)}
.hc .as{margin-top:auto;font:400 12px/1.4 var(--sans);color:var(--bone);border-top:1px solid var(--edge);padding-top:7px}
@keyframes fromdeck{from{opacity:0;transform:translate(-38vw,-140px) rotate(-24deg) scale(.6)}to{opacity:1;transform:rotate(var(--r)) translateY(var(--y))}}
@media (max-width:640px){.tabletop{grid-template-columns:minmax(0,1fr)}.pile{flex-direction:row;padding-top:0}.stack{width:56px}}
/* the veil: tune it, the weave, the book */
body.veiled{overflow:hidden}
.veil{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:clamp(10px,3vw,34px);
  background:rgba(5,8,16,.62);backdrop-filter:blur(9px) brightness(.55);-webkit-backdrop-filter:blur(9px) brightness(.55);animation:vin .35s ease both}
@keyframes vin{from{opacity:0}to{opacity:1}}
.vmodal{width:min(1040px,100%);max-height:calc(100vh - 40px);overflow:auto;border-radius:18px;padding:clamp(18px,3vw,34px);
  background:radial-gradient(900px 400px at 50% 0%,rgba(201,164,74,.08),transparent 70%),linear-gradient(180deg,var(--felt-hi),var(--felt));
  border:1px solid var(--gilt);box-shadow:0 0 0 1px rgba(201,164,74,.4),0 0 50px rgba(201,164,74,.28),0 40px 90px rgba(0,0,0,.7);
  animation:mglow 3.4s ease-in-out infinite,min .45s cubic-bezier(.2,.8,.2,1) both}
@keyframes mglow{50%{box-shadow:0 0 0 1px rgba(227,192,106,.6),0 0 70px rgba(227,192,106,.38),0 40px 90px rgba(0,0,0,.7)}}
@keyframes min{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:none}}
.mhead{text-align:center;margin-bottom:20px}
.mtitle{font:400 clamp(26px,4.4vw,42px)/1.05 var(--display);color:var(--bone);margin:6px 0 0}
.msent{font:400 clamp(16px,2vw,19px)/1.45 var(--serif);color:var(--bone);max-width:760px;margin:12px auto 0;text-wrap:balance}
.msent i{color:var(--gilt-hi)}
.macts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:22px}
.macts a{text-decoration:none;display:inline-flex;align-items:center}
.mnote{text-align:center;font:italic 400 15px/1.4 var(--serif);color:var(--bone-lo);margin:12px 0 0}
.refused{text-align:left;max-width:640px;margin:14px auto 0;color:var(--bone-lo);font:400 14px/1.5 var(--sans)}
/* her two buttons */
.herchoice{display:flex;flex-direction:column;align-items:center;gap:12px}
.herchoice .twins{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.mini.keep{background:var(--gilt);color:var(--felt);border-color:var(--gilt)}
/* the weave */
.loom{text-align:center;padding:6px 0}
.gather{position:relative;height:260px;margin:18px auto 8px;max-width:520px}
.gather img{position:absolute;left:50%;top:50%;width:64px;aspect-ratio:2/3;object-fit:cover;border-radius:6px;border:1px solid rgba(0,0,0,.6);
  box-shadow:0 10px 20px rgba(0,0,0,.6);transform:translate(-50%,-50%) translate(var(--x),var(--y)) rotate(var(--rot));
  animation:gather 2.6s cubic-bezier(.6,.05,.3,1) var(--d) forwards}
@keyframes gather{70%{transform:translate(-50%,-50%) translate(calc(var(--x) * .25),calc(var(--y) * .25)) rotate(0deg)}

.ld-name input{min-height:44px;padding:8px 12px;border-radius:8px;border:1px solid var(--gilt);background:rgba(5,8,16,.6);color:var(--gilt-hi);font:400 20px/1.2 var(--display)}
.ld-toast.on{transform:translate(-50%,0);opacity:1}
</style>

<div class="wrap">
  <div class="top">
    <div><div class="brand">SEREN</div><div class="ask" id="ask">Choose your campaign.</div></div>
    <div class="note" id="note">The deal</div>
  </div>

  <section class="shelf" id="shelf">
    <div class="list" role="tablist" aria-label="Campaigns" id="list"></div>
    <article class="detail" id="detail" role="tabpanel"></article>
  </section>

  <section class="table" id="table" hidden></section>
</div>
<div class="veil" id="veil" hidden><div class="vmodal" id="vmodal" role="dialog" aria-modal="true"></div></div>
<div>
</div>

<script>
(function(){
var D={campaigns:[]};
var $=function(id){return document.getElementById(id)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
var LOCK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>';
var FLAME='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 3c1 3 5 5 5 10a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-3-1-5 1-9z"/></svg>';
var current=0;
var OWN={own:true,title:'Make your own',level:'any',length:'you choose',selectable:true};
function renderOwn(){
  $('detail').setAttribute('aria-labelledby','tab-'+current);
  $('detail').innerHTML='<div class="hero ownhero"><div class="cap"><h2>Make your own</h2><div class="tag">Nothing locked. She deals every card from the whole Loom, and the weaver writes a campaign nobody has played.</div></div></div>'+
    '<div class="body"><div><p class="desc">The fortune teller deals seven slots from every deck at once: trope, origin, world, trouble, her antagonist, two companions and the voice that tells it. Keep what you like, redeal what you don&#39;t, then tune the stakes.</p>'+
    '<ul class="facts"><li>Every slot dealt, none locked</li><li>Any level, any length</li><li>All five dials, full range</li><li>A new book every time</li></ul></div>'+
    '<div class="side">'+(window.SEREN_APP?'<button class="go" disabled>On the web table for now</button>':'<a class="go" href="/loom" style="text-decoration:none">Open the Loom</a>')+'</div></div>';
}

/* ── shelf ── */
function renderList(){
  $('list').innerHTML=D.campaigns.concat([OWN]).map(function(c,i){
    return '<button class="tab" role="tab" id="tab-'+i+'" aria-selected="'+(i===current)+'" aria-controls="detail" data-i="'+i+'">'+
      (c.own?'<span class="thumb own" aria-hidden="true">✦</span>':'<img class="thumb" src="'+c.back+'" alt="">')+
      '<span><span class="t">'+esc(c.title)+'</span><span class="m" style="display:block">Level '+c.level+' · '+esc(c.length)+'</span>'+
      '<span class="st '+(c.selectable?'ready':'soon')+'">'+(c.own?'From scratch':c.selectable?'Ready to deal':'Coming soon')+'</span></span></button>';
  }).join('');
  $('list').querySelectorAll('.tab').forEach(function(b){b.onclick=function(){current=+b.dataset.i;renderList();renderDetail()}});
  $('list').onkeydown=function(e){if(e.key!=='ArrowDown'&&e.key!=='ArrowUp'&&e.key!=='ArrowRight'&&e.key!=='ArrowLeft')return;
    e.preventDefault();var n=D.campaigns.length+1;current=(current+(e.key==='ArrowDown'||e.key==='ArrowRight'?1:-1)+n)%n;renderList();renderDetail();$('tab-'+current).focus()};
}
function renderDetail(){
  var c=D.campaigns[current]||OWN;
  if(c.own) return renderOwn();
  $('detail').setAttribute('aria-labelledby','tab-'+current);
  $('detail').innerHTML=
    '<div class="hero"><img src="'+c.header+'" alt=""><div class="cap"><h2>'+esc(c.title)+'</h2><div class="tag">'+esc(c.tagline)+'</div></div></div>'+
    '<div class="body"><div>'+
      '<p class="desc">'+esc(c.description)+'</p>'+
      '<ul class="facts">'+c.key_info.map(function(k){return '<li>'+esc(k)+'</li>'}).join('')+'</ul>'+
      '<div class="lbl mute" style="margin-bottom:10px">Locked in this campaign</div>'+
      '<div class="chips">'+c.tags.locked.map(function(t){return '<span class="chip">'+LOCK+esc(t)+'</span>'}).join('')+
      '<span class="chip chaos">'+FLAME+'Chaos: '+esc(c.tags.chaos)+'</span></div>'+
    '</div><div class="side">'+
      '<div class="backs" aria-hidden="true"><img src="'+c.back+'" alt=""><img src="'+c.back+'" alt=""><img src="'+c.back+'" alt=""></div>'+
      '<div class="lbl">Its deck</div>'+
      (c.selectable?'<button class="go" id="build">Build my adventure</button>':'<button class="go" disabled>Coming soon</button>')+
    '</div></div>';
  var b=$('build'); if(b) b.onclick=function(){openTable(c)};
}

var CHAIN_SVG=(function(){
  // One chain across the middle of the card, between its line and its note, so the text stays readable.
  var a='',b='';for(var i=0;i<12;i++){var x=-4+i*14;if(i%2)b+='<ellipse cx="'+x+'" cy="126" rx="8.5" ry="3" />';else a+='<ellipse cx="'+x+'" cy="126" rx="8.5" ry="5.5" />'}
  return '<svg viewBox="0 0 150 225" preserveAspectRatio="none" aria-hidden="true"><g fill="none" stroke="#2c3038" stroke-width="5">'+a+b+'</g><g fill="none" stroke="#a7adb7" stroke-width="2.4">'+a+'</g><g fill="none" stroke="#7f858f" stroke-width="2.4">'+b+'</g></svg>';
})();
var PADLOCK='<svg class="lock" viewBox="0 0 34 40" aria-hidden="true"><path d="M9 17v-6a8 8 0 0 1 16 0v6" fill="none" stroke="#9aa0aa" stroke-width="3.5"/><rect x="4" y="16" width="26" height="22" rx="4" fill="#5d636e" stroke="#2c3038" stroke-width="1.5"/><circle cx="17" cy="25" r="3" fill="#1d2027"/><rect x="15.8" y="26" width="2.4" height="7" rx="1" fill="#1d2027"/></svg>';
/* ── the table ── */
// The Loom's table, on a published campaign. Her voice and her three offers top left, her counter
// top centre, the music top right. The deck sits on the felt; locked cards are face up in chains,
// sealed ones under wax. You click a card in your hand to read what it changes, then play it; a
// played card is fixed unless you deal again. She plays her card after your last pick.
var ROW=[['trope','Trope'],['world','World'],['trouble','Trouble'],['pc','You play'],['origin','Origin'],
  ['companions','Companion'],['companions','Companion'],['persona','Told by']];
var ASK={pc:'Who are you? Three, dealt.',origin:'Where did you come from? Three things, dealt.',
  companions:'Who is beside you? Four, dealt. Take two.',persona:'Who is telling it? Three voices, dealt.'};
var KICK={pc:'You play · who you are',origin:'Origin · where you came from',companions:'Companion · who is beside you',persona:'Told by · the voice'};
var HAND={pc:3,origin:3,companions:4,persona:3};
var T=null;
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function slotsOf(c){var s=c.deck.slots;return ROW.filter(function(x){return s[x[0]]})}
function drawHand(k){var d=T.c.deck.slots[k].deck;return shuffle(d).slice(0,Math.min(HAND[k]||3,d.length))}
function deal(c){
  var s=c.deck.slots,pile=0;
  T={c:c,hands:{},picks:{companions:[]},her:[],herAt:0,herUp:false,herKept:false,active:null,pile:0};
  Object.keys(s).forEach(function(k){var sl=s[k];if(sl.mode!=='dealt')return;pile+=sl.deck.length;
    if(k==='posture')T.her=shuffle(sl.deck);else T.hands[k]=drawHand(k)});
  T.pile=pile;T.active=nextActive();
}
function chosen(k){return k==='companions'?T.picks.companions.length>=2:!!T.picks[k]}
function laid(){return Object.keys(T.hands).every(chosen)}
function done(){return laid()&&(!T.her.length||T.herKept)}
function nextActive(){var order=ROW.map(function(x){return x[0]});for(var i=0;i<order.length;i++){var k=order[i];if(T.hands[k]&&!chosen(k))return k}return null}
function says(){
  if(T.active)return ASK[T.active]||'Choose.';
  if(T.her.length&&!T.herUp)return 'I have played. Turn it over when you are ready.';
  if(T.her.length&&!T.herKept)return 'That is who you are up against. Keep it, or make me play again.';
  return 'That is a game. Shall we?';
}
function faceHTML(label,k,extra){
  return '<div class="face front'+(extra||'')+'"><div class="k">'+esc(label)+'</div><div class="n">'+esc(k.name)+'</div><div class="l">'+esc(k.line)+'</div></div>';
}
var SEAL='<svg class="seal" viewBox="0 0 60 60" aria-hidden="true"><defs><radialGradient id="wx" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#b8322a"/><stop offset=".7" stop-color="#7a1712"/><stop offset="1" stop-color="#4d0d0a"/></radialGradient></defs><path d="M30 4c5 0 7 3 11 4s8 1 10 5-1 7 0 11 4 7 2 11-6 4-8 7-3 8-8 9-8-2-12-2-8 3-12 0-2-7-4-10-7-6-6-10 4-6 4-10-2-8 2-11 8-1 11-3 5-5 10-5z" fill="url(#wx)"/><circle cx="30" cy="30" r="13" fill="none" stroke="#e08a6a" stroke-opacity=".45" stroke-width="1.5"/><text x="30" y="35.5" text-anchor="middle" font-family="Cinzel Decorative,serif" font-size="15" fill="#f2b49a" fill-opacity=".8">S</text></svg>';
function back(){return '<div class="face back"><img src="'+T.c.back+'" alt=""></div>'}
function slotHTML(x,n){
  var k=x[0],label=x[1],sl=T.c.deck.slots[k],key=k+(k==='companions'?n:'');
  var head='<div class="lbl">'+esc(label)+'</div>';
  if(sl.mode==='locked') return '<div class="slot" data-at="'+key+'">'+head+
    '<div class="c3 up locked"><div class="in">'+back()+faceHTML(label,sl.card)+'</div><div class="chains">'+CHAIN_SVG+PADLOCK+'</div></div><div class="under">locked</div></div>';
  if(sl.mode==='hidden') return '<div class="slot" data-at="'+key+'">'+head+
    '<div class="c3 sealed" title="Sealed until the story opens it"><div class="in">'+back()+'</div><div class="waxbox">'+SEAL+'</div></div><div class="under">sealed</div></div>';
  var pick=k==='companions'?T.picks.companions[n]:T.picks[k],on=T.active===k;
  if(pick) return '<div class="slot" data-at="'+key+'">'+head+
    '<div class="c3 up mine"><div class="in">'+back()+faceHTML(label,pick,' gilt')+'</div></div>'+
    '<button class="redeal" data-redeal="'+k+'" data-n="'+n+'" title="A fresh deal for this slot, and one drawn from it">↻ deal again</button></div>';
  return '<div class="slot" data-at="'+key+'">'+head+'<button class="empty'+(on?' on':'')+'" data-slot="'+k+'">'+(on?'Choosing…':'Choose')+'</button><div class="under">&nbsp;</div></div>';
}
function rowHTML(){var count={};return slotsOf(T.c).map(function(x){var n=count[x[0]]||0;count[x[0]]=n+1;return slotHTML(x,n)}).join('')}
function herHTML(){
  if(!T.her.length)return '';
  var h=T.her[T.herAt],cap='<div class="lbl mute">Her counter · the antagonist</div>';
  if(!laid())return '<div class="counter">'+cap+'<div class="cslot">She plays once your hand is laid</div></div>';
  return '<div class="counter">'+cap+
    '<div class="c3 her '+(T.herUp?'up':'down hersdown')+'" id="her" role="button" tabindex="'+(T.herUp?-1:0)+'" aria-label="'+(T.herUp?'Her card: '+esc(h.name):'Her card, face down. Turn it over')+'">'+
      '<div class="in">'+back()+faceHTML('Antagonist',h)+'</div>'+(T.herUp?'':'<span class="ribbon">Turn it over</span>')+'</div>'+
    (T.herUp&&!T.herKept?'<div class="twins"><button class="mini keep" data-her="keep">Keep it</button>'+(T.her.length>1?'<button class="mini" data-her="another">Make her play another</button>':'')+'</div>':'')+
    (T.herKept?'<div class="twins"><button class="mini" data-her="another">Make her play another</button></div>':'')+'</div>';
}
function handHTML(){
  var k=T.active;
  if(!k){
    if(T.her.length&&!T.herUp)return '<div class="herchoice"><p class="handnote">Your hand is laid. Now she plays hers: the one you are up against.</p><button class="go" id="turnher">Turn her card over</button></div>';
    if(T.her.length&&!T.herKept)return '<div class="herchoice"><p class="handnote">That is who you are up against.</p><div class="twins"><button class="go" data-her="keep">Keep it</button>'+(T.her.length>1?'<button class="ghost" data-her="another">Make her play another</button>':'')+'</div></div>';
    return '<div class="herchoice"><p class="handnote">That is a game. Shall we?</p><button class="go" id="retune">Tune it</button></div>';
  }
  var cards=T.hands[k],label=(ROW.filter(function(x){return x[0]===k})[0]||[k,k])[1],many=k==='companions',mid=(cards.length-1)/2;
  return '<div class="handhead"><span class="lbl">Your hand · '+esc(label)+'</span><span class="lbl mute">'+(many?'pick two · '+T.picks.companions.length+' of 2 · ':'')+cards.length+' of '+T.c.deck.slots[k].deck.length+' · she holds the rest</span></div>'+
    '<div class="fan">'+cards.map(function(card,i){
      var taken=many&&T.picks.companions.some(function(p){return p.id===card.id});
      return '<button class="hc'+(taken?' taken':'')+'" data-i="'+i+'" style="--r:'+((i-mid)*5)+'deg;--y:'+(Math.abs(i-mid)*8)+'px;animation-delay:'+(i*0.09)+'s">'+
        '<span class="k">'+esc(label)+(taken?' · taken':'')+'</span><span class="n">'+esc(card.name)+'</span><span class="l">'+esc(card.line)+'</span></button>';
    }).join('')+'</div>';
}
function sentence(){
  var s=T.c.deck.slots;
  function v(k,n,how){var card;
    if(!s[k])return '';
    if(s[k].mode==='locked')card=s[k].card;
    else if(s[k].mode==='hidden')return '<i>something sealed</i>';
    else if(k==='posture')card=T.herUp?T.her[T.herAt]:null;
    else if(k==='companions')card=T.picks.companions[n||0];
    else card=T.picks[k];
    if(!card)return '<span class="blank">'+(k==='posture'?'her card':'a card to choose')+'</span>';
    var t=card.name;if(how==='low')t=t.charAt(0).toLowerCase()+t.slice(1);if(how==='the')t='the '+t.toLowerCase();
    return '<i>'+esc(t)+'</i>';}
  return v('trope')+'. '+(s.pc?'You play '+v('pc')+', from ':'From ')+v('origin',0,'low')+', in '+v('world',0,'low')+', facing '+v('trouble',0,'low')+'; with '+v('companions',0,'low')+' and '+v('companions',1,'low')+', against '+v('posture',0,'the')+', told by '+v('persona')+'.';
}
function topEl(){return document.querySelector('.top')}
function openTable(c){
  // Step 1, who you play: dealt from the campaign's deck, or your own character fitted on the ladder.
  var pc=c.deck&&c.deck.slots&&c.deck.slots.pc;
  if(pc&&pc.mode==='dealt')return whoStep(c);
  startTable(c);
}
function startTable(c,own){
  deal(c);
  if(own){T.picks.pc=own;delete T.hands.pc;T.active=nextActive()}
  $('shelf').hidden=true;$('table').hidden=false;topEl().hidden=true;
  renderTable(true);window.scrollTo({top:0});
  setTimeout(function(){smoke(document.querySelector('.pile .stack'),6)},250);
}
function renderTable(fresh){
  var c=T.c;
  $('table').innerHTML=
    '<div class="lbar">'+
      '<div class="lleft"><div class="brand">SEREN</div><p class="says" id="says">'+esc(says())+'</p>'+
        '<div class="offers"><button class="ghost gilt" id="dealAgain"'+(T.active?'':' disabled')+'>Deal these again</button>'+
        '<button class="ghost" id="newHand">I don’t like any of these. New hand.</button>'+
        '<button class="ghost" id="playOut">Play it out for me</button></div>'+
        '<div class="links"><button class="howlink" id="howAgain">house rules</button><button class="howlink" id="back">back to the shelf</button></div></div>'+
      '<div class="lmid">'+herHTML()+'</div>'+
      '<div class="lright"><div class="sound"><button class="soundbtn" id="mute" title="Music on or off" aria-label="Music on or off"><span id="muteIcon">♪</span></button>'+
        '<input type="range" id="vol" min="0" max="100" value="30" title="Volume" aria-label="Music volume"></div>'+
        '<div class="note">'+(FAKE?'Local · fake AI':'')+'</div></div>'+
    '</div>'+
    '<div class="felt lit">'+motesHTML()+'<div class="tabletop">'+
      '<div class="pile" aria-hidden="true"><div class="stack">'+[4,3,2,1,0].map(function(i){return '<img src="'+c.back+'" alt="" style="--i:'+i+'">'}).join('')+'</div><div class="lbl">Her deck · '+T.pile+'</div></div>'+
      '<div class="row" id="row" style="--n:'+slotsOf(c).length+'">'+rowHTML()+'</div></div>'+
      '<div class="synopsis"><div class="lbl">'+esc(c.title)+' · the story you are filling in</div><p>'+esc(c.tagline)+' <span>Level '+esc(c.level)+' · '+esc(c.length)+'.</span></p></div>'+
      '<div class="hand'+(fresh?' fresh':'')+'" id="hand">'+handHTML()+'</div></div>';
  wire();paintSound();
}
function rerender(fresh){var y=window.scrollY;renderTable(!!fresh);window.scrollTo({top:y});}
function slotEl(key){return document.querySelector('[data-at="'+key+'"] .c3')}
function play(k,card){
  var key=k;
  if(k==='companions'){var l=T.picks.companions,at=-1;l.forEach(function(p,j){if(p.id===card.id)at=j});
    if(at>=0){l.splice(at,1);rerender();return}
    if(l.length>=2)l.shift();l.push(card);key='companions'+(l.length-1);
    if(l.length>=2)T.active=nextActive();}
  else{T.picks[k]=card;T.active=nextActive()}
  rerender(true);smoke(slotEl(key),5);
  if(laid()&&T.her.length&&!T.herUp)setTimeout(function(){smoke($('her'),5)},350);
}
function redeal(k,n){
  // The Loom's "reroll one thing": a fresh deal for that slot, and one drawn from it that isn't the current pick.
  T.hands[k]=drawHand(k);
  var cur=k==='companions'?T.picks.companions.map(function(p){return p.id}):[T.picks[k]&&T.picks[k].id];
  var fresh=T.hands[k].filter(function(x){return cur.indexOf(x.id)<0});
  if(k==='companions'){if(fresh.length)T.picks.companions[n]=fresh[0]}
  else if(fresh.length)T.picks[k]=fresh[0];
  rerender(false);smoke(slotEl(k+(k==='companions'?n:'')),5);
}
function turnHer(){
  var her=$('her');if(!her||T.herUp)return;
  her.classList.remove('down','hersdown');her.classList.add('up');var r=her.querySelector('.ribbon');if(r)r.remove();
  smoke(her,7);T.herUp=true;setTimeout(function(){rerender()},700);
}
function wire(){
  var c=T.c;
  $('newHand').onclick=function(){deal(c);renderTable(true);smoke(document.querySelector('.pile .stack'),6)};
  $('dealAgain').onclick=function(){if(!T.active)return;T.hands[T.active]=drawHand(T.active);rerender(true);smoke(document.querySelector('.pile .stack'),4)};
  $('playOut').onclick=function(){
    Object.keys(T.hands).forEach(function(k){var h=shuffle(T.hands[k]);
      if(k==='companions')T.picks.companions=h.slice(0,2);else if(!T.picks[k])T.picks[k]=h[0]});
    T.active=null;T.herUp=!!T.her.length;rerender(false);
    document.querySelectorAll('.slot .c3').forEach(function(el,i){setTimeout(function(){smoke(el,3)},i*90)});
  };
  $('howAgain').onclick=openHow;
  $('back').onclick=function(){$('table').hidden=true;$('shelf').hidden=false;topEl().hidden=false;renderDetail()};
  $('row').querySelectorAll('[data-slot]').forEach(function(el){el.onclick=function(){T.active=el.dataset.slot;rerender(true)}});
  $('row').querySelectorAll('[data-redeal]').forEach(function(el){el.onclick=function(){redeal(el.dataset.redeal,+el.dataset.n)}});
  var her=$('her');
  if(her&&!T.herUp){her.onclick=turnHer;her.onkeydown=function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();turnHer()}}}
  var tb=$('turnher');if(tb)tb.onclick=function(){window.scrollTo({top:0,behavior:'smooth'});setTimeout(turnHer,350)};
  document.querySelectorAll('[data-her]').forEach(function(b){b.onclick=function(){
    if(b.dataset.her==='keep'){T.herKept=true;rerender();openTune();return}
    T.herAt=(T.herAt+1)%T.her.length;T.herUp=false;T.herKept=false;rerender();setTimeout(turnHer,250)}});
  var rt=$('retune');if(rt)rt.onclick=openTune;
  $('hand').querySelectorAll('.hc').forEach(function(b){b.onclick=function(){openCard(T.active,+b.dataset.i)}});
  wireSound();
}
function openCard(k,i){
  var card=T.hands[k][i],taken=k==='companions'&&T.picks.companions.some(function(p){return p.id===card.id});
  veil('<div class="cardview"><div class="cvhead"><span class="lbl">'+esc(KICK[k]||k)+'</span><span class="lbl mute">'+(i+1)+' of '+T.hands[k].length+'</span></div>'+
    '<h3 class="cvname">'+esc(card.name)+'</h3><p class="cvline">'+esc(card.line)+'</p>'+
    '<div class="cvrow"><span class="lbl mute">What it changes</span><p>'+esc(card.changes)+'</p></div>'+
    (card.as?'<div class="cvrow"><span class="lbl mute">At this table</span><p>'+esc(card.as)+'</p></div>':'')+
    '<div class="macts"><button class="ghost" id="putback">Put it back</button><button class="go" id="playit">'+(taken?'Take it back':'Play it')+'</button></div></div>');
  $('putback').onclick=unveil;

}

      clearInterval(L.poll);$('veil').dataset.locked='';unveil();startTable(L.c,card);
    })};
}
function ldAsk(what){
  var kind=what.split(':')[0],name=what.slice(kind.length+1),j=L.j;
  var text='At Seren’s table I’m bringing '+ldName()+' ('+j.cls+(j.subclass?', '+j.subclass:'')+', level '+j.from+') into '+L.c.title+' at level '+j.target+
    '. The '+kind+' “'+name+'” isn’t in the rules Seren can check. What should Seren treat it as? When we agree, record it with seren_ruling (character key '+L.key+', kind '+kind+', name “'+name+'”).';
  L.asked=true;
  if(window.serenAsk){window.serenAsk(text).then(function(){ldToast('Sent to the chat. Talk it over there; the ladder picks up the ruling.')}).catch(function(){ldToast('The chat didn’t take it. Copy the question from here instead.')});ldPoll()}
  else ldToast('In Claude, this goes to the chat: “'+text+'”');
}
function ldPoll(){var n=0;clearInterval(L.poll);L.poll=setInterval(function(){if(++n>45||$('veil').hidden){clearInterval(L.poll);return}ladder()},4000)}
function ldToast(t){var e=$('ldToast');if(!e){e=document.createElement('div');e.id='ldToast';e.className='ld-toast';e.setAttribute('role','status');document.body.appendChild(e)}
  e.textContent=t;e.classList.add('on');clearTimeout(e.k);e.k=setTimeout(function(){e.classList.remove('on')},6500)}

function openTune(){
  var c=T.c;
  veil('<div class="mhead"><div class="lbl">Tune your loom</div><h3 class="mtitle">'+esc(c.title)+'</h3><p class="msent">'+sentence()+'</p>'+
    '<p class="mnote">These never pick a card. The hand is dealt and it stands; this is what she is told about how to write it, and leaving every one alone is a perfectly good answer.</p></div>'+
    dialsHTML(c)+
    '<div class="macts"><button class="ghost" id="mback">← Back to the table</button><button class="ghost gilt" id="rolld">Roll the stakes</button><button class="go" id="weave">Weave my book</button></div>'+
    (FAKE?'<p class="mnote">Fake AI is on: the book is canned, built from your cards. Nothing is spent.</p>':''));
  wireDials(c);
  $('mback').onclick=function(){T.herKept=false;unveil();rerender()};
  $('rolld').onclick=function(){DIALS.forEach(function(x){var el=$('dial-'+x[0]),lo=+el.dataset.lo,hi=+el.dataset.hi;el.value=Math.round(lo+Math.random()*(hi-lo));$('v-'+x[0]).textContent=el.value})};
  $('weave').onclick=function(){weaveIt(c)};
}
function plainSentence(){var d=document.createElement('div');d.innerHTML=sentence();return d.textContent}
function weaveIt(c){
  var s=c.deck.slots,cards={},picks={campaign:c.slug,campaign_title:c.title};
  var face=function(k){return{id:k.id,name:k.name,line:k.line,changes:k.changes,as:k.as,own:k.own||undefined}};
  Object.keys(s).forEach(function(k){if(s[k].mode==='locked'){cards[k]=face(s[k].card);picks[k]=s[k].card.id}});
  Object.keys(T.picks).forEach(function(k){if(k!=='companions'&&T.picks[k]){cards[k]=face(T.picks[k]);picks[k]=T.picks[k].id}});
  if(T.her.length){cards.posture=face(T.her[T.herAt]);picks.posture=T.her[T.herAt].id}
  cards.companions=T.picks.companions.map(face);picks.companions=T.picks.companions.map(function(k){return k.id});
  var dials={};DIALS.forEach(function(x){dials[x[0]]=+$('dial-'+x[0]).value});
  var n=slotsOf(c).length+1,said=plainSentence();
  veil('<div class="loom"><div class="lbl red">Weaving</div><p class="bigsent">'+esc(said)+'</p>'+
    '<p class="mnote">This takes about ten seconds. She is writing three fronts, an antagonist and seven secrets, and only some of them are yours to know.</p>'+
    '<div class="gather">'+Array.from({length:n},function(_,i){var a=(i/n)*Math.PI*2;
      return '<img src="'+c.back+'" alt="" style="--x:'+Math.round(Math.cos(a)*170)+'px;--y:'+Math.round(Math.sin(a)*80)+'px;--d:'+(i*0.12)+'s;--rot:'+Math.round((i-n/2)*9)+'deg">'}).join('')+
    '<div class="threads"><i></i><i></i><i></i><i></i><i></i></div><div class="shuttle"></div></div>'+
    '<ol class="wsteps"><li id="w1">She weaves your hand into one story</li><li id="w2">The Doorkeeper reads it, and may send it back</li><li id="w3">It is bound, and dealt out as yours</li></ol></div>',true);
  var lit=function(id,t){setTimeout(function(){var el=$(id);if(el)el.classList.add('on')},t)};
  lit('w1',300);lit('w2',1900);lit('w3',3300);
  setTimeout(function(){smoke(document.querySelector('.gather'),8)},2300);
  var minWait=new Promise(function(r){setTimeout(r,4200)});
  var body={picks:picks,cards:cards,dials:dials};
  var call=window.serenWeave?window.serenWeave(body):fetch('/api/weave',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})
    .then(function(r){return r.json().then(function(j){return{ok:r.ok,j:j}})});
  Promise.all([call,minWait]).then(function(res){var x=res[0];$('veil').dataset.locked='';
    if(!x.ok){veil('<div class="mhead"><div class="lbl">The Doorkeeper sent it back</div><p class="msent">'+esc(x.j.error||'It failed')+'</p>'+
      ((x.j.problems||[]).length?'<ul class="refused">'+x.j.problems.map(function(p){return '<li>'+esc(p)+'</li>'}).join('')+'</ul>':'')+
      '</div><div class="macts"><button class="go" id="again">Tune it again</button></div>');$('again').onclick=openTune;return}
    showBook(x.j,c,said);
  }).catch(function(e){$('veil').dataset.locked='';veil('<div class="mhead"><div class="lbl">Could not reach the server</div><p class="msent">'+esc(String(e))+'</p></div><div class="macts"><button class="go" id="again">Try again</button></div>');$('again').onclick=openTune});
}
function inline(s){return esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\*(.+?)\*/g,'<em>$1</em>')}
function md(text){
  var L=String(text||'').replace(/<!--[\s\S]*?-->/g,'').split('\n'),out=[],i=0,toc=[];
  while(i<L.length){var l=L[i];
    if(/^---\s*$/.test(l)){out.push('<hr>');i++;continue}
    var h=/^(#{1,3})\s+(.*)$/.exec(l);
    if(h){var lv=h[1].length,id='ch'+toc.length;if(lv===2)toc.push([id,h[2]]);out.push('<h'+(lv+1)+(lv===2?' id="'+id+'"':'')+'>'+inline(h[2])+'</h'+(lv+1)+'>');i++;continue}
    if(/^\|/.test(l)){var rows=[];while(i<L.length&&/^\|/.test(L[i])){rows.push(L[i]);i++}
      var cells=function(r){return r.replace(/^\||\|$/g,'').split('|').map(function(x){return x.trim()})};
      var body=rows.filter(function(r){return !/^\|[\s|:-]+\|$/.test(r)});var head=cells(rows[0]),blank=head.every(function(x){return !x});
      out.push('<table>'+(blank?'':'<thead><tr>'+head.map(function(x){return '<th>'+inline(x)+'</th>'}).join('')+'</tr></thead>')+'<tbody>'+
        body.slice(blank?0:1).filter(function(r){return !cells(r).every(function(x){return !x})}).map(function(r){return '<tr>'+cells(r).map(function(x){return '<td>'+inline(x)+'</td>'}).join('')+'</tr>'}).join('')+'</tbody></table>');continue}
    if(/^\s*-\s+/.test(l)){var it=[];while(i<L.length&&/^\s*-\s+/.test(L[i])){it.push('<li>'+inline(L[i].replace(/^\s*-\s+/,''))+'</li>');i++}out.push('<ul>'+it.join('')+'</ul>');continue}
    if(/^>\s?/.test(l)){var q=[];while(i<L.length&&/^>\s?/.test(L[i])){q.push(L[i].replace(/^>\s?/,''));i++}out.push('<blockquote>'+inline(q.join(' '))+'</blockquote>');continue}
    if(!l.trim()){i++;continue}
    var p=[];while(i<L.length&&L[i].trim()&&!/^(#|\||>|---|\s*-\s)/.test(L[i])){p.push(L[i]);i++}out.push('<p>'+inline(p.join(' '))+'</p>');
  }
  return {html:out.join(''),toc:toc};
}
function showBook(j,c,said){
  var b=md(j.book||'');
  veil('<div class="bookwrap">'+
    '<div class="reveal"><div class="lbl red">Your loom is woven</div><p class="bigsent small">'+esc(said)+'</p>'+
      '<p class="mnote">Written, read at the door, and dealt out as yours.</p>'+
      '<h3 class="rtitle">'+esc(j.title)+'</h3>'+(j.where?'<p class="bwhere">'+esc(j.where)+'</p>':'')+
      '<p class="rprem">'+esc(j.premise)+'</p><blockquote class="ropen">'+esc(j.opening)+'</blockquote>'+
      '<div class="macts"><button class="ghost" id="mback">← Back to the table</button>'+(window.serenDownload?'<button class="ghost" id="dl">Download the book (.md)</button>':'<a class="ghost" href="/api/book?slug='+encodeURIComponent(j.slug)+'" download>Download the book (.md)</a>')+
      (window.SEREN_APP?'':'<a class="go" id="sit" href="'+(j.play||'/table')+'">Sit down at the table</a>')+'</div></div>'+
    (b.toc.length?'<div class="lbl" style="text-align:center;margin:26px 0 14px">The book</div>'+
      '<div class="bookbody"><nav class="toc" aria-label="Chapters">'+b.toc.map(function(t){return '<a href="#'+t[0]+'">'+inline(t[1])+'</a>'}).join('')+'</nav>'+
      '<article class="pages" id="pages">'+b.html+'</article></div>':'')+'</div>');
  $('mback').onclick=function(){unveil()};
  if($('sit'))$('sit').onclick=function(){fadeOutMusic()};
  if($('dl'))$('dl').onclick=function(){window.serenDownload(j)};
  if(window.serenWoven)window.serenWoven(j);
  $('vmodal').querySelectorAll('.toc a').forEach(function(a){a.onclick=function(e){e.preventDefault();var t=document.getElementById(a.getAttribute('href').slice(1));if(t)$('pages').scrollTo({top:t.offsetTop-$('pages').offsetTop-8,behavior:'smooth'})}});
}
/* ── the table's own randomness ──
   Every so often, while you sit at the table and nothing is open over it, something happens that
   nobody asked for: a will-o'-wisp drifts along the top, a cat paws at one of your cards, or the cat
   turns your music off. ?mischief=fast makes it every few seconds, for looking at. */
function motesHTML(){var h='';for(var i=0;i<16;i++){h+='<i style="left:'+Math.round(Math.random()*100)+'%;top:'+Math.round(Math.random()*100)+'%;--d:'+(14+Math.random()*16).toFixed(1)+'s;--dl:-'+(Math.random()*20).toFixed(1)+'s;--dx:'+Math.round(Math.random()*80-40)+'px"></i>'}return '<div class="motes" aria-hidden="true">'+h+'</div>'}
var PAW='<svg viewBox="0 0 60 220" aria-hidden="true"><path d="M14 220 L14 56 Q14 22 30 18 Q46 22 46 56 L46 220 Z" fill="#17151b"/>'+
  '<path d="M30 6c-14 0-24 12-24 26 0 12 10 20 24 20s24-8 24-20C54 18 44 6 30 6z" fill="#1d1a21"/>'+
  '<ellipse cx="30" cy="36" rx="9" ry="7" fill="#7a5662"/><ellipse cx="15" cy="22" rx="4.2" ry="5" fill="#7a5662"/><ellipse cx="24" cy="15" rx="4.2" ry="5" fill="#7a5662"/>'+
  '<ellipse cx="36" cy="15" rx="4.2" ry="5" fill="#7a5662"/><ellipse cx="45" cy="22" rx="4.2" ry="5" fill="#7a5662"/>'+
  '<path d="M18 60 Q30 66 42 60" stroke="#26232b" stroke-width="2" fill="none"/></svg>';
function quietMotion(){return matchMedia('(prefers-reduced-motion: reduce)').matches}
function paw(target,onTouch){
  if(!target||quietMotion())return false;
  var r=target.getBoundingClientRect(),p=document.createElement('div');p.className='paw';p.innerHTML=PAW;
  p.style.left=Math.round(r.left+r.width/2-30+(Math.random()*20-10))+'px';
  document.body.appendChild(p);
  var reach=window.innerHeight-(r.top+r.height*0.55),tilt=Math.random()<0.5?-1:1;
  var a=p.animate([{transform:'translateY(0) rotate(0deg)'},
    {transform:'translateY(-'+(reach*0.8)+'px) rotate('+(4*tilt)+'deg)',offset:.32},
    {transform:'translateY(-'+reach+'px) rotate('+(-7*tilt)+'deg)',offset:.46},
    {transform:'translateY(-'+(reach-8)+'px) rotate('+(9*tilt)+'deg)',offset:.56},
    {transform:'translateY(-'+reach+'px) rotate('+(-4*tilt)+'deg)',offset:.64},
    {transform:'translateY(0) rotate(0deg)'}],{duration:3400,easing:'ease-in-out'});
  setTimeout(function(){if(onTouch)onTouch()},3400*0.46);
  a.onfinish=function(){p.remove()};
  return true;
}
function jiggle(el){if(el)el.animate([{transform:'rotate(0)'},{transform:'rotate(-5deg) translateX(-4px)'},{transform:'rotate(4deg) translateX(3px)'},{transform:'rotate(-2deg)'},{transform:'rotate(0)'}],{duration:700,easing:'ease-out'})}
function wisp(){
  if(quietMotion())return false;
  var w=document.createElement('div');w.className='willo';
  var y=Math.round(window.innerHeight*(0.06+Math.random()*0.22)),ltr=Math.random()<0.6;
  w.style.top=y+'px';document.body.appendChild(w);
  var from=ltr?-60:window.innerWidth+60,to=ltr?window.innerWidth+60:-60,dur=11000+Math.random()*5000;
  var a=w.animate([{transform:'translate('+from+'px,0)'},{transform:'translate('+(from+(to-from)*0.3)+'px,-26px)'},
    {transform:'translate('+(from+(to-from)*0.55)+'px,14px)'},{transform:'translate('+(from+(to-from)*0.8)+'px,-18px)'},
    {transform:'translate('+to+'px,4px)'}],{duration:dur,easing:'linear'});
  a.onfinish=function(){w.remove()};
  return true;
}
function catCard(){
  var cards=[].slice.call(document.querySelectorAll('#row .c3'));if(!cards.length)return false;
  var c=cards[Math.floor(Math.random()*cards.length)];
  return paw(c,function(){jiggle(c);smoke(c,2)});
}
function catMusic(){
  if(!started||muted)return false;
  return paw($('mute'),function(){
    muted=true;if(fading)clearInterval(fading);players.forEach(function(a){a.pause()});started=false;paintSound();
    jiggle($('mute'));var s=$('says');if(s)s.textContent='The cat has opinions about the music.';
  });
}
var FAST=/[?&]mischief=fast/.test(location.search);
function mischief(kind){
  if(!T||$('table').hidden||!$('veil').hidden||document.hidden)return false;
  var pool=kind?[kind]:['wisp','wisp','cat','cat','music'];
  var k=pool[Math.floor(Math.random()*pool.length)];
  return k==='wisp'?wisp():k==='cat'?catCard():(catMusic()||wisp());
}
window.serenMischief=mischief;
(function next(){setTimeout(function(){mischief();next()},FAST?(5000+Math.random()*4000):(40000+Math.random()*45000))})();
// Inside Claude the app swaps these for MCP tool calls (seren/mcp/server.py injects them).
(window.serenShelf||function(){return fetch('/api/published').then(function(r){return r.json()})})().then(function(j){
  D.campaigns=j.campaigns||[];FAKE=!!j.fake_ai;
  $('note').textContent=FAKE?'Local · fake AI · nothing spent':'The deal';
  renderList();renderDetail();
}).catch(function(){$('detail').innerHTML='<p class="desc" style="padding:24px">Could not load the campaigns.</p>'});
})();

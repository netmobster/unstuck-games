name: traffic

# GitHub throws away views and clones after 14 days. This keeps them.
# Runs daily; also runnable by hand from the Actions tab.

on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Snapshot traffic
        env:
          GH_TOKEN: ${{ secrets.TRAFFIC_TOKEN || github.token }}
        run: node .github/scripts/traffic-snapshot.mjs

      - name: Commit if anything changed
        run: |
          if [ -z "$(git status --porcelain metrics)" ]; then
            echo "No change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metrics
          git commit -m "metrics: traffic for $(date -u +%F)"
          git push

<html lang="en">
<meta charset="utf-8">

<title>Elsible</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500&family=IBM+Plex+Serif:ital,wght@0,400;0,500;1,400&family=Space+Mono:wght@400;700&display=swap">
<style>
/* Layout: a reader's table. Dealer's card at the head, the hand's sentence in the middle, your five cards fanned at the foot. */
:root{
  --ink:#100d0b; --cloth:#16100f;
  --bone:#e8e1d6; --dust:#a39a8f; --dust-hi:#c4bcb1;
  --copper:#b07a4e; --copper-hi:#c89060; --gilt:#d6a46a; --ember:#e07a58;
  --hair:rgba(232,225,214,.09); --edge:rgba(232,225,214,.16);
  --sans:'IBM Plex Sans', system-ui, sans-serif;
  --serif:'IBM Plex Serif', Georgia, serif;
  --mono:'Space Mono', ui-monospace, monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--ink)}
body{margin:0;background:radial-gradient(110% 70% at 50% 0%, #2a1b18 0%, var(--cloth) 45%, var(--ink) 100%) fixed;color:var(--bone);font-family:var(--sans);font-weight:300;line-height:1.55;font-size:16px;padding-inline:16px;padding-block:0 40px}
::selection{background:var(--copper);color:var(--ink)}
.wrap{max-width:1040px;margin:0 auto}
.label{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--dust)}
.label.gilt{color:var(--gilt)} .label.ember{color:var(--ember)}
button.b{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;padding:9px 13px;border-radius:2px;cursor:pointer;border:1px solid var(--edge);background:transparent;color:var(--dust-hi)}
button.b:hover{color:var(--bone);border-color:var(--dust)}
button.b.go{background:var(--copper);color:var(--ink);border-color:var(--copper)}
button.b.go:hover{background:var(--copper-hi)}
button.b:disabled{opacity:.35;cursor:not-allowed}
button:focus-visible{outline:1px solid var(--gilt);outline-offset:2px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;padding-block:16px 0}
.top .left{display:grid;gap:6px}
.mark{font-family:var(--serif);font-size:22px}
.mark em{font-style:italic;color:var(--gilt)}
.say{font-family:var(--serif);font-style:italic;color:var(--dust-hi);font-size:15px;margin:0}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.dealer{display:grid;justify-items:center;gap:8px;margin-top:-8px}
.mini{width:110px;aspect-ratio:5/7.2;border-radius:8px;position:relative}
.back{background:
  radial-gradient(circle at 50% 50%, transparent 0 18%, rgba(214,164,106,.18) 18.5% 19.5%, transparent 20%),
  repeating-linear-gradient(45deg, rgba(214,164,106,.10) 0 1px, transparent 1px 12px),
  repeating-linear-gradient(-45deg, rgba(214,164,106,.10) 0 1px, transparent 1px 12px),
  linear-gradient(160deg, #3a1d22, #1f1012);
  border:1px solid rgba(214,164,106,.45);box-shadow:inset 0 0 0 5px #1a0e10, inset 0 0 0 6px rgba(214,164,106,.35)}
.mini.back{display:grid;place-items:center;text-align:center;padding:10px;font-family:var(--serif);font-style:italic;font-size:11.5px;color:var(--dust-hi);line-height:1.35}
.face{background:linear-gradient(180deg,#f1e8d8,#e2d5bf);color:#2a1d16;border:1px solid #c9b48f;box-shadow:inset 0 0 0 4px #f1e8d8, inset 0 0 0 5px #b8945f;display:flex;flex-direction:column;gap:5px;padding:12px 10px}
.face .s{font-family:var(--mono);font-size:8.5px;letter-spacing:.16em;text-transform:uppercase;color:#8a6a43;text-align:center}
.face .n{font-family:var(--serif);font-weight:500;font-size:15px;line-height:1.15;text-align:center;text-wrap:balance}
.face .l{font-family:var(--serif);font-style:italic;font-size:12px;line-height:1.3;text-align:center;color:#4a3627}
.face .c{margin-top:auto;font-size:10px;line-height:1.35;color:#5d4634;border-top:1px solid #c9b48f;padding-top:6px;text-align:center}
.mini.face.played{animation:flipin .6s cubic-bezier(.2,.8,.2,1)}
@keyframes flipin{from{transform:rotateY(90deg)}to{transform:none}}
.slots{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;margin-top:22px}
.slot{border:1px solid var(--edge);border-radius:4px;padding:8px 9px;background:rgba(16,13,11,.55);cursor:pointer;text-align:left;color:inherit;font:inherit;display:grid;gap:3px;min-height:64px}
.slot .k{font-family:var(--mono);font-size:8.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--gilt)}
.slot .v{font-family:var(--serif);font-size:13px;line-height:1.2;color:var(--bone)}
.slot .v.empty{color:var(--dust);font-style:italic}
.slot.cur{border-color:var(--gilt);box-shadow:0 0 0 1px var(--gilt)}
.slot.dealerslot{cursor:default;border-style:dashed}
.sentence{font-family:var(--serif);font-size:clamp(18px,2.4vw,24px);line-height:1.45;text-align:center;max-width:820px;margin:22px auto 0;color:var(--dust-hi);text-wrap:balance}
.sentence b{font-weight:400;color:var(--bone)}
.sentence i{color:var(--dust)}
.weavebar{display:flex;justify-content:center;margin-top:16px}
.handhead{display:flex;justify-content:space-between;align-items:baseline;margin-top:30px;border-top:1px solid var(--hair);padding-top:12px}
.fan{display:flex;justify-content:center;gap:12px;padding:18px 4px 6px;flex-wrap:nowrap;overflow-x:auto}
.card{flex:0 0 150px;aspect-ratio:5/7.2;border-radius:10px;border:0;padding:0;cursor:pointer;font:inherit;text-align:left;transition:transform .25s ease, box-shadow .25s ease;animation:dealin .45s cubic-bezier(.2,.8,.2,1) both}
.card:nth-child(1){transform:rotate(-5deg) translateY(10px)}.card:nth-child(2){transform:rotate(-2.5deg) translateY(3px)}.card:nth-child(4){transform:rotate(2.5deg) translateY(3px)}.card:nth-child(5){transform:rotate(5deg) translateY(10px)}
.card:hover{transform:translateY(-12px)!important}
.card.taken{transform:translateY(-16px)!important;box-shadow:0 0 0 2px var(--gilt), 0 14px 30px rgba(0,0,0,.5)}
.card .face{height:100%;border-radius:10px;padding:14px 12px}
.card .n{font-size:17px}.card .l{font-size:13px}.card .c{font-size:11px}
@keyframes dealin{from{opacity:0;translate:0 -24px}to{opacity:1;translate:0 0}}
.card:nth-child(2){animation-delay:.06s}.card:nth-child(3){animation-delay:.12s}.card:nth-child(4){animation-delay:.18s}.card:nth-child(5){animation-delay:.24s}
.foot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:18px;align-items:center}
.foot label{font-size:13px;color:var(--dust);display:flex;gap:8px;align-items:center}
/* the woven page */
.woven{display:grid;justify-items:center;gap:16px;padding-block:40px 20px;text-align:center}
.woven h1{font-family:var(--serif);font-weight:400;font-size:clamp(24px,3.4vw,36px);line-height:1.3;margin:0;max-width:820px;text-wrap:balance;color:#efe2c2}
.note{font-size:13px;color:#8fa0c8;max-width:560px}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:6px;text-align:left}
.steps li{font-size:14px;color:var(--dust);display:flex;gap:10px;align-items:center}
.steps li i{width:8px;height:8px;border-radius:50%;border:1px solid var(--dust);display:inline-block}
.steps li.now{color:var(--bone)} .steps li.now i{background:var(--gilt);border-color:var(--gilt);animation:pulse 1.2s infinite}
.steps li.done{color:var(--dust-hi)} .steps li.done i{background:var(--copper);border-color:var(--copper)}
.steps li.failed{color:var(--ember)} .steps li.failed i{background:var(--ember);border-color:var(--ember)}
@keyframes pulse{50%{opacity:.4}}
.title{font-family:var(--serif);font-size:clamp(22px,3vw,30px);letter-spacing:.14em;text-transform:uppercase;color:var(--gilt);margin:8px 0 0}
.life{max-width:680px;text-align:left;display:grid;gap:12px;font-family:var(--serif);font-size:17px;line-height:1.65;color:#e9dfcc}
.life p{margin:0}
.people{max-width:680px;width:100%;display:grid;gap:8px;text-align:left}
.person{border-left:1px solid var(--copper);padding:2px 0 2px 14px}
.person b{font-family:var(--serif);font-weight:500;color:var(--bone)}
.person span{display:block;font-size:14px;color:var(--dust-hi)}
.morning{max-width:680px;text-align:left;border-left:2px solid var(--gilt);padding-left:16px;font-family:var(--serif);font-size:17px;font-weight:500;color:#f0e4c8}
.andthen{font-family:var(--serif);font-style:italic;font-size:22px;color:var(--gilt)}
.problems{max-width:600px;text-align:left;color:var(--ember);font-size:13px;margin:0;padding-left:18px}
textarea#hand{width:100%;max-width:680px;min-height:80px;background:var(--ink);color:var(--dust-hi);border:1px solid var(--edge);font-family:var(--mono);font-size:11px;padding:8px}
@media (max-width:760px){.slots{grid-template-columns:repeat(2,minmax(0,1fr))}.card{flex-basis:132px}.dealer{margin-top:10px}}
@media (prefers-reduced-motion:reduce){.card,.mini.face.played,.steps li.now i{animation:none}}
</style>

<div class="wrap" id="app"></div>

<script>
const CORE = {"deck": "story", "version": 4, "about": "Elsible's deck v4 (3 Oct 2026): normal life first, the researched tropes face up and dealt first. The hidden half is the twist the weave writes for this trope, this life: each trope card carries the weave's guide (signals, if nobody intervenes, if somebody does).", "deal": {"per_slot": 5}, "slots": [{"id": "trope", "label": "THE STORY", "q": "What kind of story?", "hint": "the trope, face up", "count": 1}, {"id": "role", "label": "WHO YOU ARE", "q": "Who are you?", "hint": "a life already moving", "count": 1}, {"id": "world", "label": "WHERE", "q": "Where is this life?", "hint": "who's watching", "count": 1}, {"id": "other", "label": "THE OTHER", "q": "Who's at the centre?", "hint": "how they treat you · always fictional", "count": 1}, {"id": "circle", "label": "THE CIRCLE", "q": "Who's around you?", "hint": "pick two", "count": 2}, {"id": "told_by", "label": "TOLD BY", "q": "Who's telling it?", "hint": "the narrator's voice", "count": 1}, {"id": "modifier", "label": "THE BURN", "q": "How does it burn?", "hint": "optional", "count": 1, "optional": true}, {"id": "pressure", "label": "AND NOW", "q": "The dealer plays a complication", "hint": "make her play another", "count": 1, "dealer": true}, {"id": "secret", "label": "UNDERNEATH", "q": "Who's hiding what?", "hint": "internal: the weave's reference, never dealt", "reference": true}], "dials": [{"id": "absurdity", "name": "Absurdity", "low": "played straight", "high": "a court in your head"}, {"id": "stakes", "name": "Stakes", "low": "one evening", "high": "a whole life"}, {"id": "cost", "name": "Cost", "low": "your pride", "high": "your job, your name"}, {"id": "people", "name": "Crowd", "low": "just the two of you", "high": "everyone watching"}, {"id": "length", "name": "Length", "low": "one night", "high": "a season"}], "cards": {"trope": [{"id": "enemies", "name": "Enemies to lovers", "line": "You need the person you came here to beat", "changes": "Every scene serves two agendas", "hidden": {"signals": ["they defend something you care about when you're not there to see it", "the grudge turns out to have a second side", "your own side asks you to do something that would hurt them", "you're relieved when they win something small"], "if_nobody_intervenes": ["you meet across the table at the decisive moment, still enemies, and it hurts", "your side wins, and you're the one who has to tell them"], "if_somebody_does": "you choose them over your own side, and pay for it in public"}}, {"id": "fake", "name": "Fake dating", "line": "An arrangement, with rules", "changes": "Breaking a rule raises tension", "hidden": {"signals": ["a rule of the arrangement gets broken and nobody mentions it", "someone outside the arrangement believes it completely", "a gesture that wasn't for show", "the end date gets mentioned, and nobody laughs"], "if_nobody_intervenes": ["the arrangement ends on schedule, and only one of you meant it", "it's exposed as fake in front of the people it was for"], "if_somebody_does": "the arrangement is ended early, honestly, and what's left is real or nothing"}}, {"id": "second", "name": "Second chance", "line": "The one that got away is back in town", "changes": "The old wound is a fact from day one", "hidden": {"signals": ["the old wound gets named, lightly, by someone else", "they still do the small thing they used to do", "the reason they left was not the reason you were told", "an old friend chooses a side"], "if_nobody_intervenes": ["the same mistake, made again, in the same place", "they leave again, and this time you watch it happen"], "if_somebody_does": "the real reason is said out loud, and you decide what it changes"}}, {"id": "friends", "name": "Friends to lovers", "line": "The best thing in your life, and you might break it", "changes": "Jealousy shows what's at stake", "hidden": {"signals": ["someone else wants them, and says so", "a joke between you that lands differently this time", "a friend asks a question you answer too fast", "you notice where they sit when they come into a room"], "if_nobody_intervenes": ["someone else gets there first, and the friendship survives, worse", "it's said by accident, at the worst time, and can't be taken back"], "if_somebody_does": "one of you says it deliberately, and the friendship becomes whatever comes next"}}, {"id": "contract", "name": "Marriage of convenience", "line": "On paper it's practical. That's the deal", "changes": "Tenderness slips past the terms", "hidden": {"signals": ["a kindness the contract didn't ask for", "someone asks how long it's meant to last", "the terms get broken in a small way, and it feels like a gift", "leaving becomes possible"], "if_nobody_intervenes": ["the contract runs out and both of you sign the end", "partners in everything except the one thing"], "if_somebody_does": "someone stays when the contract says they're free to go, and says why"}}, {"id": "forbidden", "name": "Forbidden love", "line": "There's a rule, and it has teeth", "changes": "Every meeting is a risk someone can see", "hidden": {"signals": ["the rule gets enforced on somebody else, and it's brutal", "a meeting that nobody was supposed to see", "someone who could report it chooses not to, for now", "the barrier turns out to have a price"], "if_nobody_intervenes": ["it's discovered, by the worst possible person", "one of you gives it up quietly to protect the other"], "if_somebody_does": "it goes public on purpose, and the rule has to answer"}}, {"id": "betrayal", "name": "Betrayal", "line": "You trusted them first", "changes": "Trust is built where you can see it", "hidden": {"signals": ["trust built where everyone can see it", "a small lie, explained away well", "something of yours ends up where it shouldn't be", "someone else warns you, and you don't believe them"], "if_nobody_intervenes": ["the betrayal lands, and you're the last to know", "you find out, and they never learn that you did"], "if_somebody_does": "it's caught before it lands, and you decide what they're owed"}}, {"id": "impostor", "name": "The impostor", "line": "You were pretending until it mattered", "changes": "They fall for the person, not the mask", "hidden": {"signals": ["someone uses a name that isn't quite yours", "a detail from the life you claimed doesn't fit", "they start loving the person under the mask", "someone from the real past arrives"], "if_nobody_intervenes": ["the mask comes off in public, not by your choice", "the mask becomes the person, and the old one is gone"], "if_somebody_does": "you take the mask off yourself, to the one person who matters"}}, {"id": "longcon", "name": "The long con", "line": "You're here to take something", "changes": "The con only works if you mean it", "hidden": {"signals": ["the plan needs one more favour than planned", "the mark does something kind that makes it harder", "a partner in the plan gets impatient", "you start to mean what you say to them"], "if_nobody_intervenes": ["the score lands, and you lose the mark", "the con collapses and takes both of you down"], "if_somebody_does": "you choose: the score or the mark, out loud, to one of them"}}, {"id": "mole", "name": "The mole", "line": "Inside, with two loyalties", "changes": "Both sides want proof", "hidden": {"signals": ["both sides ask for proof in the same week", "the people you report on start to trust you", "a message from your handler arrives at a bad moment", "someone else is also lying, and you can tell"], "if_nobody_intervenes": ["you're caught, by the side you came to love", "you stay inside both sides until it costs someone you care about"], "if_somebody_does": "you burn one side yourself, and choose which"}}, {"id": "rise", "name": "Rise and fall", "line": "You want it, and you'll get it", "changes": "Getting it costs something you didn't price", "hidden": {"signals": ["you get something you wanted, and it costs more than you priced", "an old friend stops calling", "the people above you start treating you as one of them", "you hear yourself say something the old you would hate"], "if_nobody_intervenes": ["you reach the top, and there's nobody there you like", "you fall, in public, and find out who stayed"], "if_somebody_does": "you walk away from it, or refuse it, before it finishes you"}}, {"id": "family", "name": "Found family", "line": "Strangers who became yours", "changes": "The people outweigh the trouble", "hidden": {"signals": ["a rescue nobody asked for", "someone from your old life wants you back", "a meal that becomes a tradition", "one of them is in trouble and doesn't tell you"], "if_nobody_intervenes": ["the group scatters, and nobody chose it", "one of them is lost, and the rest hold"], "if_somebody_does": "you choose them over blood or the old life, out loud"}}, {"id": "pitch", "name": "Mixing business and pleasure", "line": "It was work, until it wasn't", "changes": "The job and the feeling want different endings", "hidden": {"signals": ["they remember a detail from a meeting you thought was only business", "a message that arrives after hours and isn't about the work", "someone in the room notices how you two talk", "the paperwork asks a question you don't want to answer honestly"], "if_nobody_intervenes": ["the deal closes and the feeling is never said", "it comes out at the worst possible meeting, in front of everyone"], "if_somebody_does": "the job and the feeling are separated, and one of them is given up on purpose"}}, {"id": "fileon", "name": "The file on them", "line": "You were looking into them. You kept looking", "changes": "Every fact you find is also a reason to like them", "hidden": {"signals": ["the record has a gap, and the gap is interesting", "someone who knew them before talks too warmly, or too carefully", "you catch yourself looking for reasons to keep looking", "they mention something you only know because you were looking"], "if_nobody_intervenes": ["they find out you were looking, from someone else", "you close the file, and know more than you can ever admit"], "if_somebody_does": "you tell them what you were doing before anyone else can"}}], "role": [{"id": "newhire", "name": "The new hire", "line": "First week, and everyone already has a version of you", "changes": "Names before loyalties · first impressions stick", "want": "to belong here", "conflict": "who you'll turn into to fit in"}, {"id": "returner", "name": "The one who came back", "line": "You left town. Now you're home", "changes": "Everyone remembers a version of you", "want": "to prove you're different now", "conflict": "the old you is still here"}, {"id": "bestfriend", "name": "The best friend", "line": "Always the confidant, never the lead", "changes": "You know everyone's secrets but your own", "want": "a story of your own", "conflict": "loyalty"}, {"id": "parent", "name": "The single parent", "line": "Someone small depends on you completely", "changes": "Your time is never yours", "want": "one thing just for you", "conflict": "guilt every time you take it"}, {"id": "bridesmaid", "name": "The bridesmaid", "line": "Again", "changes": "Always in the photos, never the point of them", "want": "to stop being the plus-one in your own life", "conflict": "you're happy for them. Mostly"}, {"id": "bodyguard", "name": "The bodyguard", "line": "Paid to stand close and see nothing", "changes": "You hear everything and can say nothing", "want": "to do the job and go home", "conflict": "it stopped being just a job"}, {"id": "assistant", "name": "The assistant", "line": "In every room, and nobody sees you", "changes": "Power is borrowed, and you know where it lives", "want": "a seat at the table", "conflict": "what you'd trade for it"}, {"id": "heir", "name": "The heir to the family business", "line": "It's yours, and you didn't want it", "changes": "Every choice is also about the family", "want": "a life you chose", "conflict": "the people counting on you"}, {"id": "nurse", "name": "The night-shift nurse", "line": "You see peopl , {"id": "hospital", "name": "The hospital", "line": "Long shifts, high stakes, a coffee machine that's always broken", "changes": "Life and death before lunch"}, {"id": "tour", "name": "The tour", "line": "A band, a bus, forty cities in sixty days", "changes": "No privacy, no days off"}, {"id": "reality", "name": "The reality show", "line": "Cameras everywhere, and a vote on Sunday", "changes": "Everything you do is edited"}, {"id": "restaurant", "name": "The family restaurant", "line": "Three generations, one kitchen, a lot of shouting", "changes": "Business and family are the same argument"}, {"id": "city", "name": "The city at night", "line": "Everyone's anonymous until they aren't", "changes": "Help and harm are one street apart"}, {"id": "otherworld", "name": "Another world", "line": "A world that isn't yours, that seems to know you", "changes": "Nothing works the way you expect"}, {"id": "oldhouse", "name": "The old house", "line": "It's been in the family a long time. So has something else", "changes": "Doors you shouldn't open, opened"}], "other": [{"id": "doesntknow", "name": "The one who doesn't know", "line": "They have no idea what you are to them", "changes": "Deflects praise · every confession is unprompted"}, {"id": "tests", "name": "The one who tests you", "line": "“Show me who you are”", "changes": "They only move on honest answers"}, {"id": "leverage", "name": "The one who knows your secret", "line": "They could ruin you, and they haven't", "changes": "They start ahead of you"}, {"id": "decided", "name": "The one who's already decided about you", "line": "Sure of you, one way or the other", "changes": "Changing their mind takes something big"}, {"id": "believer", "name": "The one who believes in you", "line": "“You'll come round. I can wait”", "changes": "Patience is their pressure"}, {"id": "left", "name": "The one who left", "line": "They had a reason, and never said it", "changes": "It starts cold and the wound is real"}, {"id": "boss", "name": let S = load() || fresh();
function fresh(){ return {packs:[], cur:"role", offers:{}, picks:{}, dealer:null, refused:[], dials:{absurdity:40,stakes:50,cost:50,people:50,length:40}, weave:null}; }
function load(){ try{ const s = JSON.parse(localStorage.getItem(KEY)||"null"); return s && s.picks ? s : null; }catch(e){ return null; } }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

function deck(){
  const d = JSON.parse(JSON.stringify(CORE));
  if(S.packs.includes("business")) for(const [slot,cards] of Object.entries(BUSINESS.cards)) (d.cards[slot] = d.cards[slot]||[]).push(...cards);
  return d;
}
let D = deck();
let SLOT = Object.fromEntries(D.slots.map(s=>[s.id,s]));
let BY = Object.fromEntries(Object.entries(D.cards).map(([s,p])=>[s,Object.fromEntries(p.map(c=>[c.id,c]))]));
function rebuild(){ D = deck(); SLOT = Object.fromEntries(D.slots.map(s=>[s.id,s])); BY = Object.fromEntries(Object.entries(D.cards).map(([s,p])=>[s,Object.fromEntries(p.map(c=>[c.id,c]))])); }

function shuffle(a){ a = a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function dealSlot(slot){ S.offers[slot] = shuffle(D.cards[slot].map(c=>c.id)).slice(0,5); }
function need(slot){ return SLOT[slot].count||1; }
function filled(slot){ const p = S.picks[slot]||[]; return SLOT[slot].optional ? true : p.length >= need(slot); }
function lifeSet(){ return PICKED.every(filled); }
function nextEmpty(){ return PICKED.find(s => !SLOT[s].optional && !filled(s)) || (S.picks.modifier ? null : (S.cur==="modifier"?null:"modifier")); }

/* The dealer plays a complication once the life is set, leaning toward what the hand makes likely. */
function dealerPlays(){
  const pool = D.cards.pressure.filter(c=>!S.refused.includes(c.id));
  if(!pool.length){ S.refused = []; return dealerPlays(); }
  const aff = c => { let n=0; for(const [ls,ids] of Object.entries(S.picks)) for(const id of ids){ const lc = BY[ls][id]; if(((lc.pulls||{}).pressure||[]).includes(c.id)) n++; if(((c.pulls||{})[ls]||[]).includes(id)) n++; } return n; };
  const w = pool.map(c=>1+2*aff(c)); let r = Math.random()*w.reduce((a,b)=>a+b,0);
  for(let i=0;i<pool.length;i++){ r-=w[i]; if(r<=0) return pool[i].id; }
  return pool[pool.length-1].id;
}

function name(slot, i=0){ const id=(S.picks[slot]||[])[i]; return id ? BY[slot][id].name : null; }
function sentenceHTML(){
  const b = x => `<b>${esc(x)}</b>`, it = x => `<i>${esc(x)}</i>`;
  const role = name("role"), world = name("world"), other = name("other");
  const circ = (S.picks.circle||[]).map(id=>BY.circle[id].name.toLowerCase());
  const mod = name("modifier"), told = name("told_by"), press = S.dealer ? BY.pressure[S.dealer].name.toLowerCase() : null;
  return `${role ? b(role) : it("Someone")} ${world ? "in "+b(world.toLowerCase()) : it("somewhere")}, `
    + `${other ? "with "+b(other.toLowerCase())+" at the centre" : it("with someone at the centre")}, `
    + `${circ.length ? b(circ.join(" and "))+" around you" : it("nobody yet around you")}`
    + `${mod ? "; "+b(mod.toLowerCase()) : ""}; `
    + `${press ? "and now "+b(press) : it("and then...")} — `
    + `${told ? "told by "+b(told.toLowerCase()) : it("told by a voice not yet chosen")}.`;
}
function sentenceText(){ const t = document.createElement("div"); t.innerHTML = sentenceHTML(); return t.textContent; }

function faceHTML(slot, c, cls=""){

}

function render(){
  if(S.weave) return renderWoven();
  if(!S.offers[S.cur]) { dealSlot(S.cur); save(); }
  const dealerCard = S.dealer ? BY.pressure[S.dealer] : null;
  const slotsHTML = [...PICKED, "pressure"].map(id=>{
    const s = SLOT[id];
    if(id==="pressure") return `<div class="slot dealerslot"><span class="k">${esc(s.label)}</span><span class="v ${dealerCard?"":"empty"}">${dealerCard?esc(dealerCard.name):"the dealer's card"}</span></div>`;
    const ids = S.picks[id]||[], v = ids.map(x=>BY[id][x].name).join(" & ");
    return `<button class="slot ${S.cur===id?"cur":""}" data-slot="${id}"><span class="k">${esc(s.label)}</span><span class="v ${v?"":"empty"}">${v?esc(v):(s.optional?"optional":"not yet")}</span></button>`;
  }).join("");
  const s = SLOT[S.cur], taken = S.picks[S.cur]||[];
  const fan = S.offers[S.cur].map(id=>`<button class="card ${taken.includes(id)?"taken":""}" data-id="${esc(id)}" aria-pressed="${taken.includes(id)}" aria-label="${esc(BY[S.cur][id].name)}">${faceHTML(S.cur, BY[S.cur][id])}</button>`).join("");
  const ask = need(S.cur)>1 ? "pick two" : (s.optional ? "pick one, or leave it" : "pick one");
  $("#app").innerHTML = `
    <div class="top">
      <div class="left"><span class="mark">Els<em>ible</em></span><p class="say">${esc(s.q)} Five cards, dealt.</p>

        ${dealerCard ? `<div class="mini face played">${faceHTML("pressure", dealerCard).replace(/^<div class="face ">|<\/div>$/g,"")}</div><button class="b" id="another">Make her play another</button>`
                     : `<div class="mini back">She plays once your life is set</div>`}

    <div class="fan" id="fan">${fan}</div>

  document.querySelectorAll(".slot[data-slot]").forEach(el=>el.onclick=()=>{ S.cur = el.dataset.slot; save(); render(); });
  document.querySelectorAll("#fan .card").forEach(el=>el.onclick=()=>take(el.dataset.id));
  $("#again").onclick = ()=>{ dealSlot(S.cur); S.picks[S.cur] = []; afterChange(); };
  $("#newhand").onclick = ()=>{ const packs = S.packs; S = fresh(); S.packs = packs; save(); render(); };
  $("#auto").onclick = playItOut;
  const an = $("#another"); if(an) an.onclick = ()=>{ S.refused.push(S.dealer); S.dealer = dealerPlays(); save(); render(); };
  $("#weave").onclick = ()=>{ S.weave = {state:"weaving"}; save(); renderWoven(); weave(); };
  $("#biz").onchange = e=>{ S.packs = e.target.checked ? ["business"] : []; rebuild(); S.offers = {}; for(const sl of PICKED) S.picks[sl] = (S.picks[sl]||[]).filter(id=>BY[sl][id]); if(S.dealer && !BY.pressure[S.dealer]) S.dealer = null; save(); render(); };
}

function take(id){
  const n = need(S.cur), cur = S.picks[S.cur]||[];
  if(cur.includes(id)) S.picks[S.cur] = cur.filter(x=>x!==id);
  else S.picks[S.cur] = n>1 ? (cur.length<n ? [...cur,id] : [...cur.slice(1),id]) : [id];
  if((S.picks[S.cur]||[]).length >= n){ const nx = PICKED.find(sl => sl!==S.cur && !(S.picks[sl]||[]).length && !SLOT[sl].optional); if(nx) S.cur = nx; }
  afterChange();
}
function afterChange(){
  if(lifeSet() && !S.dealer) S.dealer = dealerPlays();
  if(!lifeSet()) { /* the dealer waits for a complete life */ }
  save(); render();
}
function playItOut(){
  for(const sl of PICKED){
    if(!S.offers[sl]) dealSlot(sl);
    const n = need(sl);
    if(SLOT[sl].optional){ S.picks[sl] = Math.random()<.5 ? [S.offers[sl][0]] : []; continue; }
    S.picks[sl] = shuffle(S.offers[sl]).slice(0,n);
  }
  S.dealer = null; S.refused = []; S.dealer = dealerPlays();
  save(); render();
}

function handLines(){
  const L = [];
  for(const sl of PICKED) for(const id of (S.picks[sl]||[])){ const c = BY[sl][id]; L.push(`- ${SLOT[sl].label} (${sl}): ${c.name} - "${c.line}" - in play: ${c.changes}`); }
  const p = BY.pressure[S.dealer]; L.push(`- AND NOW (pressure, played by the dealer): ${p.name} - "${p.line}" - in play: ${p.changes}`);
  return L.join("\n");
}
function refLines(slot){ return D.cards[slot].map(c=>`- ${c.id}: ${c.name} - ${c.line}`).join("\n"); }

${handLines()}

THE WEAVE
${JSON.stringify(w)}

Check: (1) every card is honoured, including both circle cards, the narrator's voice and the dealer's complication; (2) the parts the player sees (title, you, life, people, first_morning) do not reveal or hint too directly at the hidden block; (3) names and facts are consistent everywhere; (4) the person is specific, not a stock type; (5) the Other is described by how they treat the player, never as a love interest; (6) PG-13.

Reply with ONLY this JSON:
{"ok": true or false, "problems": ["short description of each problem found, empty if ok"], "mended": null if ok, otherwise the COMPLETE corrected weave in exactly the same shape}`;
}

function setStep(n, failed){ document.querySelectorAll(".steps li").forEach((li,i)=>{ li.classList.toggle("done", i<n); li.classList.toggle("now", i===n && !failed); li.classList.toggle("failed", i===n && !!failed); }); }

async function weave(){
  let sample = null;
  try{ sample = await claude.use("sample"); }catch(e){ sample = null; }
  if(!sample){ S.weave = {state:"plain", data: plainWeave()}; save(); renderWoven(); return; }
  try{
    setStep(0);
    const w = await sample.json(weavePrompt(), {modelTier:"default", cache:false});
    if(!w || !w.title || !w.life || !w.hidden) throw {code:"invalid_json", message:"missing fields"};
    setStep(1);
    let a = null;
    try{ a = await sample.json(auditPrompt(w), {modelTier:"default", cache:false}); }catch(e){ a = null; }
    const mended = a && a.ok === false && a.mended && a.mended.title && a.mended.life ? a.mended : null;
    S.weave = {state:"woven", data: mended || w, audit: a ? {ok: !!a.ok, problems: a.problems||[], mended: !!mended} : {skipped:true}};
    save(); setStep(3); renderWoven();
  }catch(e){
    const code = e && e.code;
    if(code === "not_granted" || code === "sampling_disabled"){ S.weave = {state:"plain", data: plainWeave()}; }
    else S.weave = {state:"failed", error: (e && (e.message || e.code)) || "the weaver did not answer"};
    save(); renderWoven();
  }
}

function plainWeave(){
  const p = sl => (S.picks[sl]||[]).map(id=>BY[sl][id]);
  const role=p("role")[0], world=p("world")[0], other=p("other")[0], circ=p("circle"), press=BY.pressure[S.dealer];
  return {title: `${world.name.replace(/^The /,"")}, and then`, you:{name:"You", past: role.line+".", want:"Something this place has not given you yet."},
    life:[`${role.name}. ${role.line}. ${role.changes.split(" · ")[0]}.`, `${world.name}: ${world.line.toLowerCase()}. ${press.name} — ${press.line.toLowerCase()}.`],
    people:[{name: other.name, who:"the Other", with_you: other.line}, ...circ.map(c=>({name:c.name, who:"the circle", with_you:c.line}))],
    first_morning:"The morning starts like any other.", hidden:null};
}

function renderWoven(){
  const W = S.weave, st = W.state, data = W.data;
  const steps = `<ol class="steps"><li><i></i>The weaver writes it</li><li><i></i>The auditor reads it, and may send it back</li><li><i></i>It is dealt out as yours</li></ol>`;
  let body = "", kicker = "Weaving", note = "The weaver is writing your life. The auditor reads it before you step in.";
  if(st==="failed"){ kicker = "It did not weave"; note = W.error; }
  if(st==="plain"){ kicker = "Your life, plainly"; note = "Claude wasn't available to this page, so this is assembled from the cards alone, with no weaver and no auditor."; }
  if(st==="woven"){
    kicker = "Your life is woven";
    note = W.audit && W.audit.mended ? "The auditor sent it back once and it was mended. Written, audited, and dealt out as yours." :
           W.audit && W.audit.skipped ? "Written and dealt out as yours. The auditor could not be reached this time." :
           "Written, audited, and dealt out as yours. The weaver wrote what is underneath; you will find it by what it does.";
  }
  if(data){
    body = `<p class="title">${esc(data.title)}</p>
      <div class="life">${(data.life||[]).map(p=>`<p>${esc(p)}</p>`).join("")}${data.you && data.you.name!=="You" ? `<p><b style="font-weight:500">${esc(data.you.name)}</b>. ${esc(data.you.past)} ${esc(data.you.want)}</p>`:""}</div>
      <div class="people">${(data.people||[]).map(p=>`<div class="person"><b>${esc(p.name)}</b><span>${esc(p.with_you)}</span></div>`).join("")}</div>
      <div class="morning">${esc(data.first_morning)}</div>
      <span class="andthen">and then...</span>`;
  }
  $("#app").innerHTML = `<div class="woven">
    <span class="label ember">${esc(kicker)}</span>
    <h1>${sentenceHTML()}</h1>
    <p class="note">${esc(note)}</p>
    ${steps}
    ${W.audit && W.audit.problems && W.audit.problems.length ? `<ul class="problems">${W.audit.problems.map(p=>`<li>auditor: ${esc(p)}</li>`).join("")}</ul>`:""}
    ${body}
    <div class="btns">
      <button class="b" id="back">Back to the table</button>
      ${st==="failed"||st==="woven"||st==="plain" ? `<button class="b" id="reweave">Weave it again</button>`:""}
      ${st==="woven"||st==="plain" ? `<button class="b go" id="copy">Weave it in Claude Code</button>`:""}
    </div>
    <p class="note" id="copied"></p>
    <textarea id="hand" readonly hidden aria-label="Your hand as JSON"></textarea>
  </div>`;
  if(st==="weaving") setStep(0); else if(st==="failed") setStep(0,true); else setStep(3);
  $("#back").onclick = ()=>{ S.weave = null; save(); render(); };
  const rw = $("#reweave"); if(rw) rw.onclick = ()=>{ S.weave = {state:"weaving"}; save(); renderWoven(); weave(); };
  const c = $("#copy"); if(c) c.onclick = async ()=>{
    const txt = JSON.stringify(handJSON(), null, 1), ta = $("#hand");
    try{ await navigator.clipboard.writeText(txt); $("#copied").textContent = "Copied. It holds the hidden half, so don't read it: paste it straight into Claude Code with \"weave this hand\"."; }
    catch(e){ ta.hidden = false; ta.value = txt; ta.focus(); ta.select(); $("#copied").textContent = "Selected. Copy it and paste it straight into Claude Code."; }
  };
}

function handJSON(){
  const cards = {}, picks = {};
  for(const sl of [...PICKED, "pressure"]){
    const ids = sl==="pressure" ? [S.dealer] : (S.picks[sl]||[]), multi = need(sl)>1;
    const face = id => ({name:BY[sl][id].name, line:BY[sl][id].line, changes:BY[sl][id].changes});
    picks[sl] = multi ? ids : (ids[0]||null);
    cards[sl] = multi ? ids.map(face) : (ids[0] ? face(ids[0]) : null);
  }
  const w = S.weave && S.weave.data;
  return {format:"seren-hand/1", deck:"story", packs:S.packs, dealt:new Date().toISOString(), source:"elsible-prototype",
          picks, dealer:{slot:"pressure", played:S.dealer, refused:S.refused}, dials:S.dials, cards,
          sentence: sentenceText(),
          weave: w ? {title:w.title, you:w.you, life:w.life, people:w.people, first_morning:w.first_morning} : null,
          hidden: w ? w.hidden : null, audit: S.weave ? S.weave.audit||null : null};
}

render();
</script>


<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unstuck Games — Don't bullshit the player.</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta name="description" content="Small games. No traps. A one-person game studio, plus robots.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Nunito+Sans:wght@400;700;800&family=Inter:wght@400;600;700&family=Bagel+Fat+One&family=Special+Elite&family=Pirata+One&family=Bangers&family=Rammetto+One&family=MedievalSharp&family=Sniglet:wght@800&family=Bowlby+One&family=Shrikhand&family=Courier+Prime:wght@700&family=Cormorant+Garamond:wght@300&family=DM+Sans:wght@400;700&family=Space+Grotesk:wght@700&family=IBM+Plex+Mono&family=Pacifico&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2efe6;--card:#faf8f2;--ink:#16163a;--muted:#565672;--accent:#2b34d6;--acid:#e9f257;--onAccent:#f2efe6;--r:28px;--rs:16px;--pill:999px;--fh:'Luckiest Guy',cursive;--fb:'Nunito Sans',sans-serif;--tapeA:#e9f257;--tapeB:#16163a;--hw:400;--hls:1px}
body[data-mode="stuck"]{--bg:#eceef1;--card:#fff;--ink:#1f2937;--muted:#6b7280;--accent:#2563eb;--acid:#d1d5db;--onAccent:#fff;--r:4px;--rs:2px;--pill:4px;--fh:'Inter',sans-serif;--fb:'Inter',sans-serif;--tapeA:#ef4444;--tapeB:#111827;--hw:700;--hls:-0.5px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--fb);transition:background .6s;-webkit-font-smoothing:antialiased}
a{color:var(--ink);text-decoration:none}a:hover{color:var(--accent)}
button,input{font-family:var(--fb)}
h1,h2,h3,.h{font-family:var(--fh);font-weight:var(--hw);letter-spacing:var(--hls);margin:0}
p{margin:0}
body[data-mode="stuck"] [data-anim]{animation-play-state:paused!important}
body[data-mode="stuck"] [data-u]{animation:none!important;transform:none!important}
.wrap{max-width:1160px;margin:0 auto;padding:0 24px}
.kick{font-weight:800;font-size:13px;letter-spacing:4px;color:var(--muted)}
.card{background:var(--card);border:2px solid var(--ink);border-radius:var(--r);transition:all .6s}
.btn{display:inline-block;border:none;cursor:pointer;border-radius:var(--pill);padding:18px 30px;font-family:var(--fh);font-weight:var(--hw);font-size:20px;letter-spacing:1px;transition:all .25s;background:var(--accent);color:var(--onAccent)}
.btn:hover{transform:translateY(-3px) rotate(-1.5deg);color:var(--onAccent)}
.btn:active{transform:scale(.97)}
.btn.ghost{background:transparent;color:var(--ink);border:3px solid var(--ink);padding:15px 28px}
.btn.ghost:hover{background:var(--acid);color:var(--ink);transform:translateY(-3px) rotate(1.5deg)}
.btn.acid{background:var(--acid);color:var(--ink)}.btn.acid:hover{color:var(--ink)}
.btn.ink{background:var(--ink);color:var(--bg)}.btn.ink:hover{background:var(--acid);color:var(--ink)}
:focus-visible{outline:3px solid var(--acid);outline-offset:2px}
/* tape + nav */
.sticky{position:sticky;top:0;z-index:50}
.tape{cursor:pointer;overflow:hidden;height:40px;display:flex;align-items:center;background:repeating-linear-gradient(-45deg,var(--tapeA) 0 22px,var(--tapeB) 22px 44px);transition:background .6s}
.tape .track{display:flex;width:max-content;animation:marquee 22s linear infinite}
.tape .grp{display:flex;gap:40px;padding-right:40px}
.tape span{background:var(--tapeB);color:var(--tapeA);font-family:var(--fh);font-weight:var(--hw);font-size:15px;letter-spacing:2px;padding:4px 14px;border-radius:var(--pill);white-space:nowrap}
nav{background:var(--bg);transition:background .6s;border-bottom:2px solid var(--ink)}
nav .wrap{padding:14px 24px;display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px}
.brand .word{display:flex;font-family:var(--fh);font-weight:var(--hw);font-size:30px;line-height:1}
.brand .u{display:inline-block;color:var(--accent);transform:translateY(-7px) rotate(-9deg);transition:all .6s}
.brand .bsub{font-weight:800;font-size:12px;letter-spacing:4px}
.links{display:flex;align-items:center;gap:22px;font-weight:700;font-size:15px;flex-wrap:wrap}
.seg{display:flex;background:var(--ink);border-radius:var(--pill);padding:4px;gap:2px}
.seg button{border:none;cursor:pointer;border-radius:var(--pill);padding:8px 16px;font-family:var(--fh);font-weight:var(--hw);font-size:14px;letter-spacing:1px;background:transparent;color:var(--bg);transition:all .3s}
.seg button.on{background:var(--acid);color:var(--ink)}
/* hero */
.hero{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:48px;align-items:center;padding:88px 0 96px}
.hero .copy{display:flex;flex-direction:column;gap:26px}
.hero h1{font-size:clamp(48px,7vw,96px);line-height:.98;text-wrap:balance}
.hero p{font-size:20px;line-height:1.5;max-width:52ch;text-wrap:pretty}
.ctas{display:flex;gap:14px;flex-wrap:wrap}
.toy{position:relative;width:100%;max-width:440px;aspect-ratio:1;margin:0 auto;background:var(--accent);border-radius:var(--r);transition:all .6s}
.toy .slot{position:absolute;left:16%;right:16%;bottom:14%;height:15%;border-radius:var(--pill);background:var(--ink);transition:all .6s}
.toy .notch{position:absolute;left:40%;right:40%;bottom:17.5%;height:8%;border-radius:var(--pill);background:var(--accent);transition:all .6s}
.toy .bigu{position:absolute;left:50%;bottom:27%;margin-left:-74px;width:148px;height:160px;border:36px solid var(--onAccent);border-top:none;border-radius:0 0 74px 74px;transform:translateY(-44px) rotate(-9deg);animation:bob 3.2s ease-in-out infinite}
.toy .s1{position:absolute;top:-8%;right:-9%;width:26%;aspect-ratio:1;border-radius:50%;background:var(--acid);animation:float 5s ease-in-out infinite;transition:background .6s}
.toy .s2{position:absolute;top:18%;left:-7%;width:15%;aspect-ratio:1;border-radius:var(--rs);background:var(--ink);animation:float 7s 1s ease-in-out infinite,spin 12s linear infinite}
.toy .s3{position:absolute;bottom:-6%;left:22%;width:24%;height:9%;border-radius:var(--pill);background:var(--onAccent);animation:float 6s .5s ease-in-out infinite}
.toy .s4{position:absolute;top:42%;right:-5%;width:11%;aspect-ratio:1;border-radius:50%;background:var(--onAccent);animation:float 4.5s 1.8s ease-in-out infinite}
/* sections */
section{padding:64px 0 96px}
.head{display:flex;flex-direction:column;gap:14px}
.head h2{font-size:clamp(36px,4.5vw,60px);line-height:1.02;text-wrap:balance}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:24px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:48px;align-items:start}
.refusal{padding:40px;display:flex;flex-direction:column;gap:18px}
.refusal.wide{grid-column:1/-1}
#bm-card{scroll-margin-top:140px}
#philosophy .grid2{grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))}
.refusal .lineage{display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-family:var(--fh);font-weight:var(--hw);font-size:22px}
.refusal .lineage b{color:var(--accent)}
.refusal .r3btn{align-self:flex-start}
.refusal .letter{font-family:var(--fh);font-weight:var(--hw);font-size:64px;line-height:1;color:var(--accent)}
.refusal h3{font-size:32px;line-height:1.05}
.refusal p{font-size:17px;line-height:1.55;text-wrap:pretty}
.quote{margin-top:auto;padding:20px 24px;background:var(--ink);color:var(--bg);border-radius:var(--rs);font-family:var(--fh);font-weight:var(--hw);font-size:22px;line-height:1.2;letter-spacing:.5px;transition:all .6s}
.body{font-size:18px;line-height:1.55;max-width:50ch;text-wrap:pretty}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chips span{border:2px solid var(--ink);border-radius:var(--pill);padding:8px 16px;font-weight:800;font-size:14px;transition:all .6s}
.adcard{padding:32px;display:flex;flex-direction:column;gap:20px}
.panel{border-radius:var(--rs);background:var(--accent);color:var(--onAccent);min-height:220px;padding:28px;display:flex;flex-direction:column;justify-content:space-between;gap:16px;transition:all .5s}
.panel.watching{background:var(--ink)}
.panel.god{background:var(--acid);color:var(--ink)}
.panel .top{display:flex;justify-content:space-between;align-items:center}
.panel .tag{font-weight:800;font-size:12px;letter-spacing:3px;opacity:.8}
.panel .active{display:none;font-family:var(--fh);font-weight:var(--hw);font-size:14px;letter-spacing:2px;background:var(--ink);color:var(--acid);padding:4px 12px;border-radius:var(--pill);animation:pulse 1s ease-in-out infinite}
.panel.god .active{display:inline-block}
.panel .title{font-family:var(--fh);font-weight:var(--hw);letter-spacing:var(--hls);font-size:clamp(30px,4vw,44px);line-height:1.05}
.bar{height:12px;border-radius:var(--pill);background:rgba(0,0,0,.18);overflow:hidden}
.bar div{height:100%;width:0;background:var(--acid);border-radius:var(--pill);transition:width .1s linear}
.panel.god .bar div{background:var(--ink)}
.admsg{font-size:15px;line-height:1.5;color:var(--muted);min-height:24px;font-weight:700}
.sub{background:var(--ink);color:var(--bg);border-radius:var(--r);padding:clamp(32px,5vw,64px);display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:48px;transition:all .6s}
.sub .left{display:flex;flex-direction:column;gap:20px}
.sub .price{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.sub .left{min-width:0}
.sub .big{font-family:var(--fh);font-weight:var(--hw);font-size:clamp(72px,10vw,150px);max-width:100%;line-height:.9;color:var(--acid);display:inline-block;animation:wiggle 4s ease-in-out infinite;transition:color .6s}
body[data-mode="stuck"] .sub .big{font-size:clamp(48px,6vw,96px);letter-spacing:-3px}
.sub .per{font-weight:800;font-size:18px;opacity:.85;max-width:16ch;line-height:1.3}
.sub h2{font-size:clamp(32px,4vw,52px);line-height:1.02;text-wrap:balance}
.sub p{font-size:18px;line-height:1.55;max-width:48ch;opacity:.9;text-wrap:pretty}
.sub .cols{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-content:start}
.sub .col{display:flex;flex-direction:column;gap:12px}
.sub .colh{font-family:var(--fh);font-weight:var(--hw);font-size:22px;letter-spacing:1px;color:var(--acid)}
.sub .colh.dim{color:inherit;opacity:.7}
.sub .item{display:flex;gap:10px;align-items:flex-start;font-weight:700;font-size:16px;line-height:1.35}
.sub .item i{flex:none;width:22px;height:22px;border-radius:50%;background:var(--acid);color:var(--ink);display:grid;place-items:center;font-weight:800;font-size:13px;font-style:normal}
.sub .item.no{opacity:.75}.sub .item.no i{background:transparent;color:inherit;border:2px solid currentColor}
.games{display:flex;flex-direction:column;gap:40px}
.games .head h2{font-size:clamp(40px,5.5vw,76px);line-height:1}
.games .head p{font-size:18px;line-height:1.5;max-width:56ch;color:var(--muted);font-weight:700;text-wrap:pretty}
.game{border-radius:var(--r);padding:32px;min-height:340px;display:flex;flex-direction:column;gap:14px;border:2px solid var(--ink);transition:all .5s;position:relative;overflow:hidden}
.game:hover{transform:translateY(-8px) rotate(-1.2deg);box-shadow:0 26px 50px rgba(22,22,58,.2)}
body[data-mode="stuck"] .game{filter:grayscale(1);background:#fff!important;color:#1f2937!important}
.game .top{display:flex;justify-content:space-between;align-items:center}
.game .genre{font-weight:800;font-size:12px;letter-spacing:3px;opacity:.75}
.game .soon{border:2px solid currentColor;border-radius:var(--pill);padding:4px 12px;font-weight:800;font-size:11px;letter-spacing:2px;white-space:nowrap;flex:none}
.game .top{gap:12px}
.game .stage{height:110px;display:flex;align-items:center;justify-content:center}
.game .name{line-height:1;text-wrap:balance}
body[data-mode="stuck"] .game .name{font-family:'Inter',sans-serif!important;font-size:26px!important;letter-spacing:-.5px!important;font-weight:700}
.game .hook{font-size:16px;line-height:1.45;font-weight:700;text-wrap:pretty}
.game .foot{margin-top:auto;font-size:13px;font-weight:800;letter-spacing:1px;opacity:.7}
.game.upcoming{filter:grayscale(1);opacity:.5}
.game.upcoming:hover{transform:none;box-shadow:none;opacity:.7}
/* on deck: fully opaque, a hint of their colour */
.game.upcoming.deck{filter:grayscale(.6);opacity:1}
.game.upcoming.deck:hover{filter:grayscale(.3);opacity:1}
.catalog-head{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;border-top:2px solid var(--ink);padding-top:14px}
.catalog-head .kick{color:var(--ink);font-size:14px}
.catalog-sub{font-weight:700;color:var(--muted);font-size:15px}
/* live game: featured, full width, running the actual game behind the card */
.game.live{grid-column:1/-1;min-height:420px;background:#080d12;color:#e6f0f0;text-decoration:none;cursor:pointer}
.game.live:hover{color:#e6f0f0;transform:translateY(-6px);box-shadow:0 30px 60px rgba(8,13,18,.45)}
.game.live iframe{position:absolute;inset:0;width:100%;height:100%;border:0;pointer-events:none;opacity:.9}
.game.live .veil{position:absolute;inset:0;background:linear-gradient(90deg,rgba(8,13,18,.88) 0%,rgba(8,13,18,.55) 45%,rgba(8,13,18,0) 80%);pointer-events:none}
.game.live>*:not(iframe):not(.veil){position:relative}
.game.live .soon{background:#5dcaa5;color:#080d12;border-color:#5dcaa5}
.game.live .mark{display:flex;align-items:center;gap:18px;margin-top:auto;color:#5dcaa5}
.game.live .mark svg{width:72px;height:72px;filter:drop-shadow(0 0 12px rgba(93,202,165,.5))}
.game.live .mark svg .spin{transform-origin:50% 50%;animation:spin 24s linear infinite}
.game.live .name{font-family:'Cormorant Garamond',Georgia,serif;font-weight:300;font-size:clamp(56px,8vw,96px);letter-spacing:.18em}
.game.live .hook{max-width:44ch;font-weight:400;color:rgba(230,240,240,.82)}
.game.live .play{display:inline-block;align-self:flex-start;margin-top:6px;background:#5dcaa5;color:#080d12;border-radius:999px;padding:14px 34px;font-family:'DM Sans',var(--fb);font-weight:700;font-size:13px;letter-spacing:.3em;text-transform:uppercase}
/* early access: playable today somewhere else (Elsewhere → Claude Code) */
.game.live.early{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);column-gap:40px;row-gap:22px;align-items:start;min-height:0;background:#1c120b;color:#f3e6d3;border-color:#1c120b}
.game.live.early .top{grid-column:1/-1;gap:16px}
.game.live.early .soon{white-space:nowrap;flex:none}
.game.live.early:hover{color:#f3e6d3;box-shadow:0 30px 60px rgba(28,18,11,.45)}
.game.live.early .copy{display:flex;flex-direction:column;gap:14px;min-width:0}
.game.live.early .soon{background:transparent;color:#f08a2c;border-color:#f08a2c}
.game.live.early .name{font-size:clamp(40px,4.6vw,66px);letter-spacing:.1em;color:#f3e6d3;line-height:1}
.game.live.early .hook{color:rgba(243,230,211,.8)}
.game.live.early .play{background:#f08a2c;color:#1c120b}
.game.live.early .foot{color:#f08a2c;opacity:.85}
.board{position:relative;border:1px solid rgba(240,138,44,.28);background:rgba(10,6,3,.55);padding:26px 24px 22px;font-family:ui-monospace,'Cascadia Mono',Consolas,monospace;font-size:13px;line-height:1.9;color:#f3e6d3;margin-top:10px}
.board-tag{position:absolute;top:-10px;right:18px;background:#1c120b;color:#f08a2c;font-size:10px;letter-spacing:.3em;padding:0 8px}
.board .b-title{font-weight:700}
.board .b-dim{color:rgba(243,230,211,.55)}
.board .b-rows{display:grid;grid-template-columns:max-content max-content max-content max-content max-content;column-gap:14px;margin-top:10px;white-space:nowrap}
.board .b-row{display:contents}
.board .b-name{font-weight:700}
.board .b-bar{color:#f08a2c;letter-spacing:1px}
.board .b-bar.unknown{color:rgba(243,230,211,.22)}
.board .b-eyes{color:#f08a2c;font-weight:700}
.board .b-head{margin-top:12px;color:#f08a2c;font-weight:700}
/* role + eyes columns drop out before anything truncates */
@media (max-width:1180px){.board .b-rows{grid-template-columns:max-content max-content max-content max-content}.board .b-row>span:nth-child(2){display:none}}
@media (max-width:900px){.game.live.early{grid-template-columns:minmax(0,1fr)}}
@media (max-width:520px){.game.live.early{padding:24px 20px}.board{font-size:12px;padding:22px 14px 18px}.board .b-rows{grid-template-columns:minmax(0,1fr) max-content max-content;column-gap:10px}.board .b-name{white-space:normal}.board .b-row>span:nth-child(5){display:none}}
body[data-mode="stuck"] .game.live .board{display:none}
/* build in progress: Bad Monkeys (colours from its own page) */
.game.live.building{background:#1c2026;color:#e6e9ee;border-color:#1c2026}
.game.live.building:hover{color:#e6e9ee;box-shadow:0 30px 60px rgba(28,32,38,.5)}
.game.live.building .soon{color:#ff5fa2;border-color:#ff5fa2}
.game.live.building .name{font-family:'Space Grotesk',var(--fb);font-weight:700;letter-spacing:-.02em;color:#e6e9ee}
.game.live.building .hook{color:#c9cfd8}
.game.live.building .play{background:#ff5fa2;color:#1c2026}
.game.live.building .foot{color:#9aa3b0;opacity:1}
.bm-art{position:relative;min-height:240px}
.bm-art svg{position:absolute;left:32%;top:8%;width:36%;animation:float 5s ease-in-out infinite}
.bm-chip{position:absolute;padding:5px 9px;background:#343a44;border:1px solid #5b6473;border-radius:3px;font:10px/1 'IBM Plex Mono',monospace;letter-spacing:2px;color:#9aa3b0;white-space:nowrap}
.bm-scrib{position:absolute;right:4%;bottom:0;font-family:'Pacifico',cursive;font-size:24px;color:#ff5fa2;transform:rotate(-8deg)}
body[data-mode="stuck"] .game.live .bm-art{display:none}
body[data-mode="stuck"] .game.live.early{grid-template-columns:1fr}
body[data-mode="stuck"] .game.live iframe,body[data-mode="stuck"] .game.live .veil,body[data-mode="stuck"] .game.live .mark svg{display:none}
.marchwrap{overflow:hidden;border-top:2px solid var(--ink);border-bottom:2px solid var(--ink);padding:14px 0}
.march{display:flex;gap:8px;width:max-content;animation:march .5s linear infinite}
.march div{width:16px;height:16px;border-radius:4px 4px 2px 2px;background:var(--ink);flex:none}
.manifesto{padding:96px 0;display:flex;flex-direction:column;gap:10px}
.manifesto .kick{margin-bottom:22px}
.manifesto .line{font-family:var(--fh);font-weight:var(--hw);letter-spacing:var(--hls);font-size:clamp(40px,7.5vw,104px);line-height:.98}
.manifesto .line.hi{color:var(--accent)}
body[data-mode="stuck"] .manifesto .line.hi{color:var(--ink)}
.faqs{display:flex;flex-direction:column;gap:12px}
.faq{background:var(--card);border:2px solid var(--ink);border-radius:var(--rs);overflow:hidden;transition:all .6s}
.faq button{width:100%;text-align:left;background:transparent;border:none;cursor:pointer;padding:20px 22px;display:flex;justify-content:space-between;align-items:center;gap:16px;font-family:var(--fh);font-weight:var(--hw);font-size:20px;letter-spacing:.5px;color:var(--ink);line-height:1.2}
.faq button:hover{background:var(--acid)}
.faq button i{flex:none;width:32px;height:32px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-size:20px;line-height:1;font-style:normal}
.faq .a{display:none;padding:0 22px 22px;font-size:16px;line-height:1.55;text-wrap:pretty}
.faq.open .a{display:block}
.wl{background:var(--accent);color:var(--onAccent);border-radius:var(--r);padding:clamp(32px,5vw,64px);display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:32px;align-items:center;transition:all .6s}
.wl h2{font-size:clamp(36px,5vw,64px);line-height:1;text-wrap:balance}
.wl p{font-size:17px;line-height:1.5;max-width:44ch;opacity:.9;text-wrap:pretty}
.wl form{display:flex;gap:10px;flex-wrap:wrap}
.wl input{flex:1;min-width:200px;padding:16px 22px;border-radius:var(--pill);border:3px solid var(--ink);background:var(--bg);color:var(--ink);font-size:17px;font-weight:700;outline:none}
.wl input:focus{border-color:var(--acid)}
.wl .done{display:none;background:var(--ink);color:var(--bg);border-radius:var(--rs);padding:24px 28px;font-family:var(--fh);font-weight:var(--hw);font-size:24px;line-height:1.2;letter-spacing:.5px}
.wl.joined form{display:none}.wl.joined .done{display:block}
footer{padding:24px 0 64px;display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;border-top:2px solid var(--ink)}

  { name: "ONE MORE CLIP", stuckName: "Paperclip Tycoon: Idle Empire", font: "'Courier Prime', monospace", size: "30px", ls: "-1px", bg: "#f2efe6", fg: "#16163a", genre: "ORIGINAL CLEAN DNA · SYSTEMIC NARRATIVE", hook: "Click → Automate → Expand → Discover What You Built", foot: "DNA: UNIVERSAL PAPERCLIPS · SYSTEMIC NARRATIVE / CC PLAYGROUND", sw: "28px", sh: "60px", sr: "999px", sc: "transparent", sb: "6px solid #16163a", anim: "spin 3s linear infinite" }
];

const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
let mode = localStorage.getItem('unstuck-mode') === 'stuck' ? 'stuck' : 'unstuck';
let ad = 'idle', progress = 0, god = 60, adCount = 0, iv = null, tt = null, openFaq = 0;
const T = () => COPY[mode], stuck = () => mode === 'stuck';
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function render() {
  const t = T();
  document.body.dataset.mode = mode;
  $$('[data-t]').forEach(el => el.textContent = t[el.dataset.t]);
  $$('[data-ph]').forEach(el => el.placeholder = t[el.dataset.ph]);
  $('#btnUnstuck').classList.toggle('on', !stuck()); $('#btnStuck').classList.toggle('on', stuck());
  $('#adRules').innerHTML = t.adRules.map(r => `<span>${esc(r)}</span>`).join('');
  $('#subPerks').innerHTML = t.subPerks.map(p => `<div class="item"><i>✓</i>${esc(p)}</div>`).join('');
  $('#subNots').innerHTML = t.subNots.map(n => `<div class="item no"><i>×</i>${esc(n)}</div>`).join('');
  // live cards are built once (their iframe runs the real game); render() only updates their text
  LIVE.forEach((g, i) => {
    const card = $$('#liveGrid .game.live')[i];
    card.querySelector('.genre').textContent = stuck() ? 'HYPER-CASUAL · LIVEOPS' : g.genre;
    card.querySelector('.soon').textContent = g.kind === 'early' ? t.early : g.kind === 'building' ? t.building : t.live;
    card.querySelector('.name').textContent = stuck() ? g.stuckName : g.name;
    card.querySelector('.hook').textContent = stuck() ? 'Free to play. In-app purchases from $0.99 to $99.99. Contains ads. Energy required.' : g.hook;
    card.querySelector('.play').textContent = stuck() ? 'Install for rewards' : g.play;
    card.querySelector('.foot').textContent = stuck() ? 'NOW WITH 40% MORE LIVEOPS' : g.foot;
  });
  const catalogCard = g => `
    <div class="game upcoming${g.deck ? ' deck' : ''}" style="background:${g.bg};color:${g.fg}">
      <div class="top"><span class="genre">${esc(stuck() ? 'HYPER-CASUAL · LIVEOPS' : g.genre)}</span><span class="soon">${esc(t.soon)}</span></div>
      <div class="stage"><div data-anim style="width:${g.sw};height:${g.sh};border-radius:${g.sr};background:${g.sc};border:${g.sb};animation:${g.anim}"></div></div>
      <div class="name" style="font-family:${g.font};font-size:${g.size};letter-spacing:${g.ls}">${esc(stuck() ? g.stuckName : g.name)}</div>
      <p class="hook">${esc(stuck() ? 'Free to play. In-app purchases from $0.99 to $99.99. Contains ads. Energy required.' : g.hook)}</p>
      <div class="foot">${esc(stuck() ? 'PRE-REGISTRATION REWARDS AVAILABLE' : (g.foot || "SHIPS WHEN IT'S FUN"))}</div>
    </div>`;
  $('#deckGrid').innerHTML = GAMES.filter(g => g.deck).map(catalogCard).join('');
  $('#gameGrid').innerHTML = GAMES.filter(g => !g.deck).map(catalogCard).join('');
  $('#manifesto').innerHTML = t.manifesto.map((l, i) => `<div class="line${i === 3 ? ' hi' : ''}">${esc(l)}</div>`).join('');
  $('#faqs').innerHTML = t.faqs.map(([q, a], i) => `
    <div class="faq${openFaq === i ? ' open' : ''}" data-i="${i}">
      <button type="button">${esc(q)}<i>${openFaq === i ? '–' : '+'}</i></button>
      <div class="a">${esc(a)}</div>
    </div>`).join('');
  $$('#faqs .faq button').forEach(b => b.onclick = () => { const i = +b.parentElement.dataset.i; openFaq = openFaq === i ? -1 : i; render(); });
  renderAd();
}
function renderAd() {
  const t = T(), p = $('#panel');
  p.className = 'panel' + (ad === 'god' ? ' god' : ad === 'watching' ? ' watching' : '');
  const clock = String(god).padStart(2, '0') + ':00';
  $('#adTag').textContent = ad === 'god' ? 'ACTIVE FOR' : ad === 'watching' ? t.adTag : (stuck() ? `AD ${adCount + 1} OF 5 · UNSKIPPABLE` : t.adIdleTag);
  $('#adTitleTxt').textContent = ad === 'god' ? `${t.adGod} · ${clock}` : ad === 'watching' ? t.adWatching : t.adIdle;
  $('#adBar').style.width = progress + '%';
  $('#adBtn').textContent = ad === 'watching' ? `Ad playing… ${progress}%` : ad === 'god' ? 'God Mode running' : (stuck() ? `${t.adBtn} (${adCount + 1}/5)` : t.adBtn);
}
function setMode(m) {
  mode = m; localStorage.setItem('unstuck-mode', m);
  clearInterval(iv); ad = 'idle'; progress = 0; adCount = 0; $('#adMsg').textContent = '';
  $('#wl').classList.remove('joined');
  render();
}
function say(msg) { const el = $('#toast'); el.textContent = msg; el.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => el.classList.remove('show'), 3600); }
function watchAd() {
  if (ad !== 'idle') return;
  clearInterval(iv); ad = 'watching'; progress = 0; $('#adMsg').textContent = ''; renderAd();
  iv = setInterval(() => { progress += 4; if (progress >= 100) { clearInterval(iv); finishAd(); } else renderAd(); }, 70);
}
function finishAd() {
  const t = T();
  if (stuck()) {
    adCount++; ad = 'idle'; progress = 0;
    if (adCount >= 5) { adCount = 0; $('#adMsg').textContent = t.adDone; }
    else $('#adMsg').textContent = `Ad ${adCount} of 5 complete. Keep going! Reward unlocks after ad 5.`;
    renderAd(); return;
  }
  ad = 'god'; god = 60; progress = 100; $('#adMsg').textContent = t.adDone; renderAd();
  iv = setInterval(() => { god--; if (god <= 0) { clearInterval(iv); ad = 'idle'; progress = 0; $('#adMsg').textContent = t.adOver; } else progress = (god / 60) * 100; renderAd(); }, 110);
}

$('#march').innerHTML = '<div></div>'.repeat(80);
// play cards run the real game behind themselves (?embed = no UI, no sound);
// early-access cards show the game's own board and link out
$('#liveGrid').innerHTML = LIVE.map(g => g.kind === 'building' ? `
  <a class="game live early building" id="bm-card" href="${g.href}">
    <div class="top"><span class="genre"></span><span class="soon"></span></div>
    <div class="copy">
      <div class="name"></div>
      <p class="hook"></p>
      <span class="play"></span>
      <div class="foot"></div>
    </div>
    <div class="bm-art" aria-hidden="true">
      <svg viewBox="0 0 120 120"><ellipse cx="60" cy="62" rx="34" ry="46" fill="#e6e9ee"/><ellipse cx="60" cy="48" rx="16" ry="18" fill="#1c2026"/><ellipse cx="55" cy="43" rx="5" ry="6" fill="#343a44"/><rect x="52" y="104" width="16" height="10" rx="2" fill="#9aa3b0"/><g transform="rotate(-18 96 40)"><rect x="88" y="20" width="16" height="42" rx="3" fill="#ff5fa2"/><rect x="84" y="14" width="24" height="8" rx="2" fill="#ff5fa2"/></g></svg>
      <span class="bm-chip" style="left:0;top:12%">SNOWPLOW · MUNICIPAL</span>
      <span class="bm-chip" style="right:0;top:48%">GRAIN AUGER · 40 FT</span>
      <span class="bm-chip" style="left:4%;bottom:10%">DOG · UNLISTED</span>
      <span class="bm-scrib">she's fine</span>
    </div>
  </a>` : g.kind === 'early' ? `
  <a class="game live early" href="${g.href}" target="_blank" rel="noopener">
    <div class="top"><span class="genre"></span><span class="soon"></span></div>
    <div class="copy">
      <div class="name"></div>
      <p class="hook"></p>
      <span class="play"></span>
      <div class="foot"></div>
    </div>
    <div class="board" aria-hidden="true">
      <div class="board-tag">THE BOARD</div>
      <div class="b-title">OSSEN'S REACH — the dawn watch</div>
      <div class="b-dim">124 coin · 10 hands · queue 0/5</div>
      <div class="b-rows">
        <div class="b-row"><span class="b-name">THE SUNDERED CHARTER</span><span class="b-dim">builders</span><span class="b-bar" id="elsewhereBar"></span><span id="elsewhereNum">8/10</span><span class="b-eyes">EYES ON</span></div>
        <div class="b-row"><span class="b-name">THE LONG HAND</span><span class="b-dim">diggers</span><span class="b-bar unknown">░░░░░░░░░░</span><span>?</span><span class="b-dim">no eyes</span></div>
        <div class="b-row"><span class="b-name">THE NINTH WATCH</span><span class="b-dim">raiders</span><span class="b-bar unknown">░░░░░░░░░░</span><span>?</span><span class="b-dim">no eyes</span></div>
      </div>
      <div class="b-head">WHAT IS COMING</div>
      <div>The Sundered Charter is about a day away.</div>
      <div class="b-dim">Those ░░░ are not zero. They are unknown.</div>
    </div>
  </a>` : `
  <a class="game live" href="${g.href}">
    <iframe src="${g.href}?embed" title="${esc(g.name)} running live" tabindex="-1" aria-hidden="true" loading="lazy"></iframe>
    <div class="veil"></div>
    <div class="top"><span class="genre"></span><span class="soon"></span></div>
    <div class="mark">${ORBIS_MARK}<div class="name"></div></div>
    <p class="hook"></p>
    <span class="play"></span>
    <div class="foot"></div>
  </a>`).join('');
// Elsewhere's watched bar fills in "real time", then the world moves on without you
{
  let filled = 5;
  const tickBar = () => {
    const bar = $('#elsewhereBar'), num = $('#elsewhereNum');
    if (!bar) return;
    bar.textContent = '█'.repeat(filled) + '░'.repeat(10 - filled);
    num.textContent = `${filled}/10`;
    filled = filled >= 10 ? 4 : filled + 1;
  };
  tickBar();
  setInterval(tickBar, 2600);
}
$('#tape').onclick = () => setMode(stuck() ? 'unstuck' : 'stuck');
$('#btnUnstuck').onclick = () => setMode('unstuck');
$('#btnStuck').onclick = () => setMode('stuck');
$('#adBtn').onclick = watchAd;
$$('.js-sub').forEach(b => b.onclick = () => say(T().subscribeToast));
// real signup: posts to Kit (kit-waitlist.js). Never says "you're in" unless Kit said success.
$('#wlForm').onsubmit = async e => {
  e.preventDefault();
  const email = $('#email').value.trim(), btn = $('#wlForm button');
  if (!email.includes('@')) { say(T().emailErr); return; }
  btn.disabled = true; const label = btn.textContent; btn.textContent = '…';
  const r = await kitSubscribe(email, $('#fname').value.trim());
  btn.disabled = false; btn.textContent = label;
  if (r.ok) $('#wl').classList.add('joined');
  else if (r.check) { $('#wl .done').innerHTML = `One more step: Kit wants to check you're human. <a href="${r.check}" target="_blank" rel="noopener" style="color:inherit;text-decoration:underline">Finish signing up ↗</a>`; $('#wl').classList.add('joined'); }
  else say(r.message);
};
render();
</script>

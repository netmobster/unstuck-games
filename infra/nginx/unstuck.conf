# unstuck-games.com — one box, one repo, one canonical config file.
#
# The apex is the studio. Every game lives on its own subdomain and serves from the
# same checkout, so deploying is still "git pull" and nothing else. The old
# subdirectory URLs are kept alive as permanent redirects: they are in the wild now
# (Substack, the picker, anything anyone bookmarked) and breaking them would be the
# one thing a studio about unbreaking things should not do.
#
# Two services run behind this: the Elsewhere world (8765) and the contact form (8770).

# Each game subdomain serves a folder of the checkout. Adding a game is one line here
# and one line in the server_name below.
map $host $game_root {
    default                          /srv/unstuck;
    orbis.unstuck-games.com          /srv/unstuck/orbis;
    badmonkeys.unstuck-games.com     /srv/unstuck/bad-monkeys;
    ferretbowling.unstuck-games.com  /srv/unstuck/ferret-bowling;
    deadline.unstuck-games.com       /srv/unstuck/deadline-dungeon;
}

# ── the studio ────────────────────────────────────────────────────────────────
server {
    server_name unstuck-games.com www.unstuck-games.com;
    root /srv/unstuck;
    index index.html;

    # The games moved to subdomains. Keep every old link working, and send it to the
    # same place inside the new host so deep links survive too.
    location = /orbis          { return 301 https://orbis.unstuck-games.com/; }
    location /orbis/           { rewrite ^/orbis/(.*)$ https://orbis.unstuck-games.com/$1 permanent; }
    location = /bad-monkeys    { return 301 https://badmonkeys.unstuck-games.com/; }
    location /bad-monkeys/     { rewrite ^/bad-monkeys/(.*)$ https://badmonkeys.unstuck-games.com/$1 permanent; }
    location = /ferret-bowling { return 301 https://ferretbowling.unstuck-games.com/; }
    location /ferret-bowling/  { rewrite ^/ferret-bowling/(.*)$ https://ferretbowling.unstuck-games.com/$1 permanent; }
    location = /deadline-dungeon { return 301 https://deadline.unstuck-games.com/; }
    location /deadline-dungeon/  { rewrite ^/deadline-dungeon/(.*)$ https://deadline.unstuck-games.com/$1 permanent; }
    location = /elsewhere      { return 301 https://elsewhere.unstuck-games.com/; }
    location /elsewhere/       { rewrite ^/elsewhere/(.*)$ https://elsewhere.unstuck-games.com/$1 permanent; }

    # The contact form. Nothing else on the apex talks to a service.
    location = /api/contact {
        proxy_pass http://127.0.0.1:8770/api/contact;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    # The journal feed, refreshed daily by unstuck-feed.timer.
    location = /feed.json {
        alias /srv/cache/feed.json;
        default_type application/json;
        add_header Cache-Control "no-cache";
    }

    location ^~ /.well-known/acme-challenge/ { root /srv/unstuck; }

    # Pages and shared scripts are small and change often. A browser holding an old
    # copy is what makes a deployed fix look broken, so they always revalidate.
    location ~* \.(html|js|json)$ {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }

    location / { try_files $uri $uri/ =404; }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/unstuck-games.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/unstuck-games.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# ── the games that are just files ─────────────────────────────────────────────
server {
    server_name orbis.unstuck-games.com badmonkeys.unstuck-games.com ferretbowling.unstuck-games.com deadline.unstuck-games.com;
    root $game_root;
    index index.html;

    # Three files live at the studio root and are shared by every game. Without
    # these the picker silently vanishes on the subdomains, which is exactly the
    # kind of break nobody notices for a week.
    location = /switcher.js    { alias /srv/unstuck/switcher.js; add_header Cache-Control "no-cache"; }
    location = /kit-waitlist.js { alias /srv/unstuck/kit-waitlist.js; add_header Cache-Control "no-cache"; }
    location = /favicon.svg    { alias /srv/unstuck/favicon.svg; }

    location ^~ /.well-known/acme-challenge/ { root /srv/unstuck; }

    location ~* \.(html|js|json)$ {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }

    location / { try_files $uri $uri/ =404; }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/unstuck-games.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/unstuck-games.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# ── Elsewhere: files, plus a world behind them ────────────────────────────────
server {
    server_name elsewhere.unstuck-games.com;
    root /srv/unstuck/elsewhere;
    index index.html;

    # "No password?" on the gate posts here. Exact match, so it wins over /api/ below.
    location = /api/contact {
        proxy_pass http://127.0.0.1:8770/api/contact;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    # The world itself. The app is entirely root-relative, so on its own host it
    # needs no rewriting at all — /play, /api/, /gate go straight through.
    location /play {
        proxy_pass http://127.0.0.1:8765/play;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
    location /api/ {
        proxy_pass http://127.0.0.1:8765/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
    location = /gate { proxy_pass http://127.0.0.1:8765/gate; }

    location = /switcher.js { alias /srv/unstuck/switcher.js; add_header Cache-Control "no-cache"; }

    location ^~ /.well-known/acme-challenge/ { root /srv/unstuck; }

    location ~* \.(html|js|json)$ {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }

    location / { try_files $uri $uri/ =404; }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/unstuck-games.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/unstuck-games.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# ── plain http: renewals, then everything up to https ─────────────────────────
server {
    listen 80 default_server;
    server_name _;
    location ^~ /.well-known/acme-challenge/ { root /srv/unstuck; }
    location / { return 301 https://$host$request_uri; }
}

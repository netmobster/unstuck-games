<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Ferret Bowling: Bowling Optional Edition — rough prototype</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Archivo:wght@400;600;700&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <header class="top">
      <div class="brand"><b>FERRET</b> <b class="teal">BOWLING</b> <span class="ed">BOWLING OPTIONAL EDITION · ROUGH PROTOTYPE · PAINTED LUCY, PLACEHOLDER HOUSE</span></div>

    <main class="app">
      <section class="stage">

      <aside class="side" id="side"></aside>

    <section class="book" id="book"></section>
    <details class="debug" id="debug"></details>
    <script type="module" src="/src/main.ts"></script>

</html>

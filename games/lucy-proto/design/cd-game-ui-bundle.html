  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

emote<\u002Fdiv>\n              <div style=\"display:flex;align-items:center;gap:7px;font-family:Caveat,cursive;font-size:18px;\"><span style=\"width:24px;height:10px;background:#b98bbf;mix-blend-mode:multiply;border-radius:5px;display:inline-block;\"><\u002Fspan>scarf<\u002Fdiv>\n              <div style=\"display:flex;align-items:center;gap:7px;font-family:Caveat,cursive;font-size:18px;color:#d8352a;\"><span style=\"width:20px;height:15px;background:#7a8a5e;mix-blend-mode:multiply;border-radius:3px;display:inline-block;\"><\u002Fspan>dish towel <span style=\"font-size:15px;\">new<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"flex:1;min-height:150px;position:relative;background:#e9e1cb;border-radius:9px 6px 9px 6px;padding:11px 12px;box-shadow:inset 0 0 0 2.5px rgba(43,36,29,.5);\">\n            <div style=\"font-family:Caveat,cursive;font-size:19px;color:#d8352a;margin-bottom:7px;\">pack the cage for run three<\u002Fdiv>\n            <div style=\"display:flex;flex-wrap:wrap;gap:7px;\">\n              <span style=\"font-family:Caveat,cursive;font-size:18px;background:#fff9ea;padding:5px 11px;border-radius:14px 6px 14px 6px;box-shadow:inset 0 0 0 2px #2b241d;\">snacks<\u002Fspan>\n              <span style=\"font-family:Caveat,cursive;font-size:18px;background:#fff9ea;padding:5px 11px;border-radius:6px 14px 6px 14px;box-shadow:inset 0 0 0 2px #2b241d;\">a wound-up sock<\u002Fspan>\n              <span style=\"font-family:Caveat,cursive;font-size:18px;background:#fff9ea;padding:5px 11px;border-radius:14px 6px 14px 6px;box-shadow:inset 0 0 0 2px #2b241d;\">a whispered insult<\u002Fspan>\n              <span style=\"font-family:Caveat,cursive;font-size:18px;background:#b98bbf;color:#2b241d;padding:5px 11px;border-radius:6px 14px 6px 14px;box-shadow:inset 0 0 0 2px #2b241d;\">purple salmon<\u002Fspan>\n              <span style=\"font-family:Caveat,cursive;font-size:18px;background:#ffd23f;padding:5px 11px;border-radius:14px 6px 14px 6px;box-shadow:inset 0 0 0 2px #2b241d;\">squeaky toy <span style=\"color:#d8352a;\">new<\u002Fspan><\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"font-family:Caveat,cursive;font-size:17px;color:#8a5a2b;margin-top:9px;\">pick two. she does the rest.<\u002Fdiv>\n          <\u002Fdiv>\n\n          <button style=\"font-family:'Alfa Slab One',serif;font-size:17px;padding:12px;background:#0f5c57;color:#f2ead3;border:2.5px solid #2b241d;border-radius:6px 4px 7px 4px;box-shadow:4px 5px 0 #2b241d;cursor:pointer;\">BACK TO THE CAGE<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- peephole: cage -->\n      <div style=\"position:relative;margin-top:16px;height:214px;overflow:hidden;border-radius:9px 6px 10px 7px;box-shadow:inset 0 0 0 3px #2b241d;background:#e2d8b8;\">\n        <div style=\"position:absolute;inset:0;background:#1d2b3a;opacity:.3;mix-blend-mode:multiply;\"><\u002Fdiv>\n        <div style=\"position:absolute;left:0;right:0;bottom:0;height:52px;background:#d3c49c;background-image:repeating-linear-gradient(90deg,rgba(43,36,29,.2) 0 2px,transparent 2px 44px);mix-blend-mode:multiply;\"><\u002Fdiv>\n\n        <div style=\"position:absolute;left:180px;top:22px;width:420px;height:150px;background:#e3d6b2;border-radius:8px 6px 9px 7px;box-shadow:inset 0 0 0 3px #2b241d;overflow:hidden;\">\n          <div style=\"position:absolute;inset:14px 0 0;background-image:repeating-linear-gradient(90deg,#2b241d 0 3px,transparent 3px 26px);opacity:.8;\"><\u002Fdiv>\n          <div style=\"position:absolute;left:-10px;top:-14px;width:440px;height:26px;background:#7a8a5e;mix-blend-mode:multiply;border-radius:5px;transform:rotate(-1.2deg);\"><\u002Fdiv>\n          <div style=\"position:absolute;left:-10px;top:-14px;width:440px;height:26px;background:repeating-linear-gradient(90deg,#d8352a 0 8px,transparent 8px 20px);mix-blend-mode:multiply;opacity:.6;transform:rotate(-1.2deg) translate(3px,1px);\"><\u002Fdiv>\n          <div style=\"position:absolute;left:150px;bottom:6px;z-index:5;\">\n            <div style=\"width:170px;height:128px;overflow:hidden;\"><img src=\"2a2f7a98-4de6-40e9-b7f0-14db352e4ec5\" alt=\"Lucy asleep\" style=\"width:100%;display:block;\"><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"position:absolute;left:290px;bottom:92px;font-family:'Alfa Slab One',serif;font-size:17px;color:#0f5c57;animation:fb-zz 3.6s ease-out infinite;\">z<\u002Fdiv>\n          <div style=\"position:absolute;left:316px;bottom:86px;font-family:'Alfa Slab One',serif;font-size:13px;color:#0f5c57;animation:fb-zz 3.6s ease-out infinite 1.2s;\">z<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"position:absolute;right:40px;top:40px;width:250px;\">\n          <div style=\"font-family:'Alfa Slab One',serif;font-size:11px;letter-spacing:.12em;color:#d8352a;\">HER DAYS<\u002Fdiv>\n          <div style=\"font-family:Caveat,cursive;font-size:19px;line-height:1.35;color:#2b241d;margin-top:6px;\">\n            <div>2. went fishing for socks, then fell asleep on the couch.<\u002Fdiv>\n            <div style=\"opacity:.6;margin-top:4px;\">1. accepted your apology, and your snacks, then fell asleep on the living room rug.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"position:absolute;left:14px;top:10px;font-family:'Alfa Slab One',serif;font-size:11px;letter-spacing:.12em;color:#d8352a;\">ZOOMED IN · THE CAGE<\u002Fdiv>\n        <div style=\"position:absolute;left:16px;bottom:14px;font-family:Caveat,cursive;font-size:20px;color:#2b241d;max-width:150px;\">She is full of socks and asleep.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <\u002Fdiv><\u002Fdiv>\n  <\u002Fsection>\n  <section class=\"screen\" id=\"notes\"><div class=\"notes\">\n<h1>Ferret Bowling — in-run UI handoff<\u002Fh1>\n<p class=\"lede\">This file is the spec. Three screens (<b>DURING RUN<\u002Fb>, <b>ZOOMED<\u002Fb>, <b>AFTER RUN<\u002Fb>) in one flat HTML file, no build, no dependencies except Google Fonts. Everything in the house is CSS — the only images are three Lucy poses.<\u002Fp>\n\n<h2>The one rule<\u002Fh2>\n<p>The player is here to <b>watch<\u002Fb>. Every pixel is either Lucy, the house she is changing, or the smallest possible readout. The moment the screen starts explaining the simulation instead of showing it, the game is a spreadsheet and we have lost. When in doubt, cut the readout and make the house bigger.<\u002Fp>\n<p>Corollary: <b>no monospace anywhere.<\u002Fb> The prototype used mono labels because it was a dev build, and mono reads as telemetry. It was the single biggest cause of \"flat and boring\". Handwriting reads as someone who lives here.<\u002Fp>\n\n<h2>Material system — a risograph dollhouse<\u002Fh2>\n<p>The house is printed paper, not a UI. Five rules produce the whole look; they are cheap and they compose.<\u002Fp>\n<ol>\n<li><b>Overprint.<\u002Fb> Every coloured shape is <code>mix-blend-mode: multiply<\u002Fcode> over the paper. Where two inks cross, they darken. Do not soften anything with <code>opacity<\u002Fcode> — let the ink stack.<\u002Fli>\n<li><b>Misregistration.<\u002Fb> A duplicate layer offset 2–3px in a second ink at 20–40%. Use it on the masthead and the cage blanket <i>only<\u002Fi>. Everywhere would read as a broken screen.<\u002Fli>\n<li><b>Hand-cut edges.<\u002Fb> Asymmetric radii — <code>border-radius: 9px 5px 11px 6px<\u002Fcode>. Never a uniform radius; uniform radius is the tell that a computer drew it. Generate the four values per element from a seeded RNG so a given room keeps its shape across runs.<\u002Fli>\n<li><b>Printed shadow.<\u002Fb> <code>box-shadow: 5px 6px 0 rgba(15,92,87,.2)<\u002Fcode> — hard, offset, tinted with a second ink. <b>Zero blur.<\u002Fb> Blurred shadows are the other tell.<\u002Fli>\n<li><b>Grain.<\u002Fb> One overlay per paper sheet: <code>radial-gradient(rgba(43,36,29,.45) .5px, transparent .6px)<\u002Fcode> at <code>background-size:3px 3px<\u002Fcode>, <code>opacity:.2<\u002Fcode>, multiply, <code>pointer-events:none<\u002Fcode>, above everything.<\u002Fli>\n<\u002Fol>\n\n<h2>Type roles — three faces, no overlap<\u002Fh2>\n<table>\n<tbody><tr><th>Face<\u002Fth><th>Used for<\u002Fth><th>Never<\u002Fth><\u002Ftr>\n<tr><td><b>Alfa Slab One<\u002Fb><\u002Ftd><td>Stamps: room names, counters, buttons, the masthead<\u002Ftd><td>Sentences<\u002Ftd><\u002Ftr>\n<tr><td><b>Caveat<\u002Fb><\u002Ftd><td>Anything the player \"wrote\": object labels, annotations, mood, prep chips<\u002Ftd><td>System state<\u002Ftd><\u002Ftr>\n<tr><td><b>Archivo<\u002Fb><\u002Ftd><td>Journal sentences — the game's own narrating voice<\u002Ftd><td>Labels<\u002Ftd><\u002Ftr>\n<\u002Ftbody><\u002Ftable>\n<p>Handwritten labels are absolutely positioned with <code>white-space: nowrap<\u002Fcode>. They may overlap the artwork a little — that is correct, they were scribbled on top. They must never overlap <i>each other<\u002Fi>.<\u002Fp>\n\n<h2>Must be driven by the sim, not by art<\u002Fh2>\n<p>Each of these is a real value the simulation already has or can cheaply produce. If any becomes a static decoration, the house stops feeling alive and you may as well delete it.<\u002Fp>\n<table>\n<tbody><tr><th>Thing on screen<\u002Fth><th>Driven by<\u002Fth><\u002Ftr>\n<tr><td>Route line, drawing itself<\u002Ftd><td>Polyline of her actual positions, revealed with <code>stroke-dashoffset<\u002Fcode> as the run advances. Post-run it stays and turns gold.<\u002Ftd><\u002Ftr>\n<tr><td>Dashed ghost outlines<\u002Ftd><td>Every object carries <code>origin<\u002Fcode> and <code>current<\u002Fcode>. If they differ, draw the dashed outline at <code>origin<\u002Fcode>. <b>Persists across runs<\u002Fb> — this is the main proof that the house remembers.<\u002Ftd><\u002Ftr>\n<tr><td>Hoard under the couch<\u002Ftd><td>One shape per treasure (cap the drawn pile at ~6, keep counting). <code>+1<\u002Fcode> pops on acquisition only.<\u002Ftd><\u002Ftr>\n<tr><td>Cage blanket<\u002Ftd><td>Mood as a single value — one ink and one stripe pattern per mood, the way grime works in Bad Monkeys. Label underneath reads \"cage — smug today\".<\u002Ftd><\u002Ftr>\n<tr><td>Slam alert<\u002Ftd><td>Only <code>outrageous<\u002Fcode>-flagged events, never ordinary journal lines. Hard budget: max one per ~20s or it stops meaning anything.<\u002Ftd><\u002Ftr>\n<tr><td>\"new!\" / \"+12\" markers<\u002Ftd><td>A <code>firstSeenRun<\u002Fcode> field on objects and journal entries.<\u002Ftd><\u002Ftr>\n<tr><td>Ambient motion<\u002Ftd><td>Free, but keep it per-room and low-amplitude: dust in the window light, fridge lamp flicker, plant sway, the pendant lamp. If it ever competes with Lucy for the eye, slow it down.<\u002Ftd><\u002Ftr>\n<\u002Ftbody><\u002Ftable>\n\n<h2>Where I departed from the brief, and why<\u002Fh2>\n<ul>\n<li><b>Four counters survive (runs / known / treasures / habits).<\u002Fb> The brief bans RPG statistics and it is right, but these are <i>collection<\u002Fi> counts: they say \"there is more Lucy to find\", not \"Lucy is 74% better\". No percentages, no affinities, no XP, ever. If someone adds a fifth counter, ask what it makes the player do.<\u002Fli>\n<li><b>One bar: energy.<\u002Fb> It is really the run clock wearing a costume. Keep it because \"she is running out of steam\" is a narrative fact. If playtesters start optimising against it, delete it.<\u002Fli>\n<li><b>Locked rooms show a threshold<\u002Fb> (\"opens at 24 known\"). That is the brief's own progression rule made visible. It must stay a journal-entry count — never a currency, never a purchase.<\u002Fli>\n<li><b>Prep is capped at two.<\u002Fb> The brief lists five preps. A cap makes prep a <i>choice<\u002Fi>; no cap makes it a loadout, and a loadout is optimisation. Tune the number, keep the cap.<\u002Fli>\n<li><b>No pause.<\u002Fb> Speeds are 1× / 4× / 16× / nap. Pausing an autonomous creature implies you are driving her.<\u002Fli>\n<li><b>Zoom replaced a second view.<\u002Fb> An earlier pass had a separate cross-section \"peephole\" panel under the plan. Cut: a second art style for the same room doubles art cost and splits the player's model of the house. Zoom is now literally the same drawing, scaled, with the chrome removed. One house, two distances.<\u002Fli>\n<li><b>The journal feed shows four entries, not a scroll.<\u002Fb> A scrollbar invites reading instead of watching. Full history belongs on the post-run screen.<\u002Fli>\n<\u002Ful>\n\n<h2>Ideas I did not build<\u002Fh2>\n<ul>\n<li><b>Desire paths.<\u002Fb> Her route should thin and darken where she has walked before, so the house slowly shows her habits without a word of copy. Cheapest possible \"you know Lucy now\" feedback.<\u002Fli>\n<li><b>The paper ages.<\u002Fb> After ~10 runs the sheet itself picks up more grain, a coffee ring, a torn corner. One value, same shape as the Bad Monkeys grime system.<\u002Fli>\n<li><b>A different ink for the unprecedented.<\u002Fb> When the sim produces a behaviour with no prior instance, print that journal card in a colour nothing else uses. That is the \"wait, she hasn't done that before\" moment made visible, and it is one <code>if<\u002Fcode>.<\u002Fli>\n<li><b>Lift the couch.<\u002Fb> Click it, the hoard lays itself out on the rug. Discovery, not inventory management.<\u002Fli>\n<li><b>Per-room ambience.<\u002Fb> Audio is by far the cheapest way to make the house feel occupied — the fridge hums, the hallway is dead quiet, the bedroom has a clock.<\u002Fli>\n<li><b>Nap-skip should still narrate.<\u002Fb> Skipping ahead shouldn't silently jump; print the two or three things that happened while you weren't looking.<\u002Fli>\n<\u002Ful>\n\n<h2>Assets<\u002Fh2>\n<ul>\n<li><b>Three poses used:<\u002Fb> <code>walk<\u002Fcode> (plan view, moving), <code>curious<\u002Fcode> (zoomed), <code>lazy<\u002Fcode> (post-run, asleep in the cage). The source PNGs have a text label baked into the bottom ~20% — cropped here with a fixed-height <code>overflow:hidden<\u002Fcode> wrapper. Re-export clean when you can.<\u002Fli>\n<li><b>Everything else is CSS.<\u002Fb> No image assets are needed for the house, the furniture or the hoard, and that is deliberate — a new object costs a div, not a drawing.<\u002Fli>\n<li><b>Fonts:<\u002Fb> Alfa Slab One, Caveat, Archivo (Google Fonts).<\u002Fli>\n<li><b>Palette:<\u002Fb> paper <code>#f2ead3<\u002Fcode>, ink <code>#2b241d<\u002Fcode>, teal <code>#0f5c57<\u002Fcode>, tomato <code>#d8352a<\u002Fcode>, marigold <code>#ffd23f<\u002Fcode>, sage <code>#7a8a5e<\u002Fcode>, terracotta <code>#c67139<\u002Fcode>, wood <code>#8a5a2b<\u002Fcode>. Eight inks, no more — a riso press has a limited drum count and the constraint is doing real work here.<\u002Fli>\n<\u002Ful>\n<\u002Fdiv><\u002Fsection>\n  <section class=\"screen\" id=\"home\"><div class=\"notes\">\n<h1>Suggested updates — the Ferret Bowling homepage<\u002Fh1>\n<p class=\"lede\">The live page sells a launcher: aim, distance in metres, rolls, top speed, surfaces, boosters with percentage buffs. The game is now a house, a memory and a journal. Most of the page describes a different product — and two sections actively contradict the red-team rule.<\u002Fp>\n\n<h2>Fix first — these contradict the design brief<\u002Fh2>\n<ol>\n<li><b>\"WHAT SHE PICKS UP\" is a stat block.<\u002Fb> <code>+40% DISTANCE<\u002Fcode>, <code>+1 ROLL PER SECOND<\u002Fcode>, <code>RICOCHET · 3 WALLS<\u002Fcode> is exactly the \"feed → stat increase → better run\" loop the brief forbids, and it is the most quotable copy on the page. Replace with <b>WHAT SHE TAKES<\u002Fb>: the same objects, described as things she has opinions about and keeps. \"Your slipper. She has had it for four runs and shows no sign of returning it.\"<\u002Fli>\n<li><b>The run-log panel<\u002Fb> (DISTANCE / ROLLS DOWN / TOP SPEED / AIRBORNE) measures a throw. Replace with what a run actually produces: <code>RUN 14 · 74s · 3 new things learned · 1 new treasure · 1 habit confirmed<\u002Fcode>.<\u002Fli>\n<li><b>\"Whatever she knocks over in the hallway, you spend on a longer hallway.\"<\u002Fb> That is a currency loop. The house opens on understanding, not spend. Suggested: \"Whatever she does in the hallway, you write down. Eventually the bathroom door opens.\"<\u002Fli>\n<\u002Fol>\n\n<h2>Re-aim — same sections, new subject<\u002Fh2>\n<table>\n<tbody><tr><th>Now<\u002Fth><th>Suggested<\u002Fth><\u002Ftr>\n<tr><td>THE RUN — rear-view hallway clip, metres ticking up<\u002Ftd><td><b>THE RUN<\u002Fb> — the plan-view house idling: route inking itself, one journal line landing, the hoard ticking to +1. Sell <i>watching<\u002Fi>, not speed.<\u002Ftd><\u002Ftr>\n<tr><td>SURFACES — \"every floor lies differently\", lino / runner / boards<\u002Ftd><td><b>THE HOUSE<\u002Fb> — \"seven rooms, opening slowly\". Living room, kitchen, hallway, bedroom, then bathroom, laundry and front entry behind journal thresholds.<\u002Ftd><\u002Ftr>\n<tr><td>Nav: LUCY · THE RUN · SURFACES · WHAT SHE PICKS UP · $5<\u002Ftd><td>LUCY · THE HOUSE · THE JOURNAL · HER TREASURES · $5<\u002Ftd><\u002Ftr>\n<tr><td>Hero promise, launcher framing<\u002Ftd><td>Keep <b>\"Aim is a suggestion\"<\u002Fb> — it survives the pivot and it is the best line on the page. Change the promise under it: \"You prep the cage, open the door, and find out who she is.\"<\u002Ftd><\u002Ftr>\n<\u002Ftbody><\u002Ftable>\n\n<h2>Add — the two sections that are now the product<\u002Fh2>\n<ul>\n<li><b>THE JOURNAL.<\u002Fb> Three real entries as paper, in the game's voice, with nothing explaining them. \"Lucy stuffed the dish towel into her favourite shoe. It is a nest now. It was always going to be a nest.\" This is the most convincing thing the game produces and the site does not show it.<\u002Fli>\n<li><b>HER TREASURES — UNDER THE COUCH.<\u002Fb> A short list that reads as a hoard, with one line making the persistence explicit: \"She has had your slipper since run 6.\"<\u002Fli>\n<\u002Ful>\n\n<h2>Do not touch<\u002Fh2>\n<ul>\n<li>Lucy's bio. It is the reason anyone cares, and \"TOP SPEED 19.4 km/h\" stays — that is a fact about a real ferret, not a game stat.<\u002Fli>\n<li>The $5 section and \"no ferret behind a paywall\".<\u002Fli>\n<li>The Galápagos tombstone.<\u002Fli>\n<li>The voice throughout. It is already right; only the nouns need changing.<\u002Fli>\n<\u002Ful>\n\n<h2>Visual<\u002Fh2>\n<p>If the game goes riso, the site should take the same ink set and the same handwriting — overprinted multiply fills, hard offset shadows, Caveat annotations in the margins. Right now the site is flat cream and Alfa Slab, which is the same problem the game UI had. One shared eight-ink palette across both would do most of the work.<\u002Fp>\n<\u002Fdiv><\u002Fsection>\n<\u002Fmain>\n<script>\ndocument.querySelectorAll('nav button').forEach(function(b){\n  b.addEventListener('click', function(){\n    document.querySelectorAll('nav button').forEach(function(x){x.setAttribute('aria-selected', x===b ? 'true':'false');});\n    document.querySelectorAll('.screen').forEach(function(s){s.classList.toggle('on', s.id===b.dataset.t);});\n    window.scrollTo(0,0);\n  });\n});\n<\u002Fscript>\n\n<\u002Fbody><\u002Fhtml>"
  </script>
